[options]
; Docker-стенд td_genset (Odoo 18.0). Только для локального стенда — не для боевого сервера.
; Модуль смонтирован в /mnt/extra-addons/td_genset; стандартные модули образа odoo:18.0 — в dist-packages.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; мастер-пароль менеджера баз (http://localhost:8069/web/database/manager): копия / восстановление стенда
admin_passwd = stand
list_db = True
without_demo = all

; один процесс: HTTP, /websocket (живое обновление карточки через bus) и cron в потоках
workers = 0
max_cron_threads = 1
limit_time_real = 600
limit_time_real_cron = 600

http_port = 8069
proxy_mode = False
log_level = info
