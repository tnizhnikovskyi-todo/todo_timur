<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меблеве підприємство 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- Стилі ядра: factory3d_viewer/static/src/viewer/viewer.scss (чистий CSS); export_viewer_assets.py кладе його як viewer/viewer.css -->
<link rel="stylesheet" href="./viewer/viewer.css">
<style>html, body { height: 100%; margin: 0; }</style>
</head>
<body>
<!-- Тонка обгортка (SPEC §8.8): розмітку, сцену й панелі будує спільне ядро F3dViewer (viewer/core.js),
     те саме, що працює в Odoo; тут лише FileClient (дані з odoo_demo.json або вбудовані) і three поруч. -->
<div id="app"></div>

<!-- ODOO_DATA -->
<!-- PARTS_MANIFEST -->
<!-- MODEL_DATA -->
<script type="module">
import { F3dViewer } from "./viewer/core.js";
import { FileClient } from "./viewer/data_client.js";

const v = new F3dViewer(document.getElementById("app"), {
  client: new FileClient("odoo_demo.json"),
  threeUrl: "./viewer/three-bundle.esm.js",
  partsUrl: "parts/manifest.json", // якщо частини не вбудовано (build_scene.py --embed): ./parts/*.glb поруч
  testMode: new URLSearchParams(location.search).has("f3d_test"),
});
window.f3d = v;
try {
  await v.mount();
  await v.load();
} catch (err) {
  console.error(err);
  document.getElementById("app").textContent = "Не вдалося запустити переглядач: " + err.message;
}
</script>
</body>
</html>
