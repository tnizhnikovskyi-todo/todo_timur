<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Меблеве підприємство 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Розкладка: 3D на весь екран, ліворуч плаваюча панель видів і шарів, праворуч картка об'єкта.
   Тон — технічна документація цеху: холодні сірі, жовта розмітка підлоги як єдиний акцент. */
:root {
  --scene: #e4e9ec;
  --bg: #eef1f3;
  --panel: rgba(250, 251, 252, 0.92);
  --panel-solid: #fafbfc;
  --fg: #1d2833;
  --muted: #5d6b78;
  --line: #cfd7de;
  --accent: #c99500;
  --accent-fg: #1d2833;
  --accent-soft: rgba(242, 194, 48, 0.22);
  --ok: #1e9e57;
  --warn: #d98a00;
  --bad: #d63a2b;
  --idle: #7f8c99;
  --flow: #18a6c9;
  --shadow: 0 6px 24px rgba(20, 35, 50, 0.12);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --scene: #1a2027; --bg: #12171c; --panel: rgba(27, 33, 40, 0.92); --panel-solid: #1b2128;
    --fg: #e3e9ee; --muted: #93a1ae; --line: #33404c; --accent: #f2c230; --accent-fg: #12171c;
    --accent-soft: rgba(242, 194, 48, 0.16); --ok: #3cc479; --warn: #f0a52a; --bad: #f0604f;
    --idle: #8d9aa6; --flow: #39c0e0; --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --scene: #1a2027; --bg: #12171c; --panel: rgba(27, 33, 40, 0.92); --panel-solid: #1b2128;
  --fg: #e3e9ee; --muted: #93a1ae; --line: #33404c; --accent: #f2c230; --accent-fg: #12171c;
  --accent-soft: rgba(242, 194, 48, 0.16); --ok: #3cc479; --warn: #f0a52a; --bad: #f0604f;
  --idle: #8d9aa6; --flow: #39c0e0; --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; background: var(--scene); }
#stage canvas { display: block; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.panel, header.bar { z-index: 2; }

.panel {
  position: absolute; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
header.bar {
  position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center;
  gap: 12px; flex-wrap: wrap; pointer-events: none;
}
header.bar > * { pointer-events: auto; }
.brand { padding: 8px 14px; display: flex; align-items: baseline; gap: 12px; position: static; }
.brand h1 { margin: 0; font: 600 18px/1.2 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.brand .dims { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#toggle-side { display: none; }

button { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--panel-solid); border-radius: 7px; padding: 6px 10px;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .view:focus-visible, .layer input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

#side {
  top: 68px; left: 12px; width: 236px; max-height: calc(100% - 132px); overflow: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 14px;
}
.sec h2 {
  margin: 0 0 6px; font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted);
}
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.view {
  border: 1px solid transparent; background: transparent; text-align: left; padding: 5px 7px;
  border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.25;
}
.view:hover { background: var(--accent-soft); }
.view[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.view kbd { font: 10px var(--f-mono); color: var(--muted); margin-right: 4px; }
.layers { display: flex; flex-direction: column; gap: 2px; }
.lgroup + .lgroup { border-top: 1px solid var(--line); padding-top: 2px; }
.lg-head { display: flex; align-items: center; gap: 4px; }
.lg-head .layer { flex: 1; font-weight: 600; }
.lg-n { font: 11px var(--f-mono); color: var(--muted); }
.lg-tog { border: 0; background: transparent; cursor: pointer; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
.lg-tog::before { content: ""; display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; }
.lg-tog[aria-expanded="true"]::before { transform: translateY(1px) rotate(-135deg); }
.lg-tog:hover { background: var(--accent-soft); color: var(--fg); }
.lg-items { display: flex; flex-direction: column; gap: 1px; padding: 0 0 4px 22px; }
.lg-items[hidden] { display: none; }
.layer { display: flex; align-items: center; gap: 8px; padding: 3px 2px; cursor: pointer; font-size: 13px; }
.layer input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.row-btns .btn { font-size: 12px; padding: 4px 8px; }

#card { top: 68px; right: 12px; width: 320px; max-height: calc(100% - 132px); overflow: auto; padding: 14px 16px; }
#card .kind { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
#card h3 { margin: 6px 0 2px; font: 600 20px/1.2 var(--f-display); text-wrap: balance; }
#card .code { font: 12px var(--f-mono); color: var(--muted); }
#card p { margin: 10px 0 0; max-width: 60ch; }
#card .actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 3px 9px 3px 7px;
  border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.chip.idle { color: var(--idle); }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
.summary div { border-top: 2px solid var(--line); padding-top: 6px; }
.summary b { display: block; font: 600 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.summary span { font-size: 11px; color: var(--muted); line-height: 1.25; display: block; }
.attn { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.attn button {
  width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; background: transparent;
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; cursor: pointer; font-size: 13px;
}
.attn button:hover { border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
.swatch { width: 14px; height: 10px; border-radius: 2px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }

#help {
  bottom: 12px; left: 12px; padding: 6px 10px; font-size: 12px; color: var(--muted);
  display: flex; gap: 14px; flex-wrap: wrap;
}
#help b { color: var(--fg); font-weight: 500; }

.lbl {
  font: 500 12px/1.2 var(--f-display); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  padding: 2px 7px; border-radius: 5px; white-space: nowrap; letter-spacing: 0.01em;
}
.lbl.zone { text-transform: uppercase; letter-spacing: 0.07em; font-size: 11px; background: transparent; border: 0; padding: 0;
  text-shadow: 0 0 3px var(--scene), 0 0 6px var(--scene); color: var(--fg); }
.lbl .st { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

#loading {
  position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--f-display);
  color: var(--muted); letter-spacing: 0.04em; pointer-events: none;
}

@media (max-width: 760px) {
  #toggle-side { display: inline-block; }
  .brand .dims { display: none; }
  #side { display: none; width: auto; right: 12px; max-height: 55%; }
  #side.open { display: flex; }
  #card { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 42%; }
  #help { display: none; }
  .views { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .btn, .view { transition: none; } }

/* ---------- Odoo: індикатор, вкладки, списки, таблиці, мітки в 3D ---------- */
#card { width: 360px; padding: 0; display: flex; flex-direction: column; }
#card > .body { padding: 12px 16px 16px; overflow: auto; min-height: 0; }
.odoo-pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; position: static;
  font-variant-numeric: tabular-nums; cursor: pointer;
}
.odoo-pill .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); }
.odoo-pill.on .live { animation: live 2s infinite; }
.odoo-pill.off .live { background: var(--bad); }
.odoo-pill b { font-weight: 600; }
.odoo-pill .muted { color: var(--muted); font-family: var(--f-mono); }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .odoo-pill.on .live { animation: none; } }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tab {
  flex: 1; border: 0; background: transparent; padding: 10px 2px 8px; font: 600 11.5px var(--f-display);
  letter-spacing: 0.01em; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.back { border: 0; background: transparent; color: var(--muted); padding: 0; cursor: pointer; font-size: 12px; margin-bottom: 8px; }
.back:hover { color: var(--fg); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 12px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.kpi b { display: block; font: 600 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }
.sub { margin: 14px 0 6px; font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.row {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; text-align: left;
  background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; cursor: pointer; font-size: 13px;
}
.row:hover, .row.active { border-color: var(--accent); }
.row .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { grid-column: 1 / -1; color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .pw { grid-column: 1 / -1; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.pbar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--line) 70%, transparent); overflow: hidden; }
.pbar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.pbar.warn > i { background: var(--warn); } .pbar.bad > i { background: var(--bad); } .pbar.flow > i { background: var(--flow); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.idle { color: var(--idle); }
.pill.info { color: var(--flow); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: top; }
.tbl td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--accent-soft); }
.lnk { border: 0; background: transparent; padding: 0; color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent);
  text-underline-offset: 2px; cursor: pointer; font: inherit; }
.note { margin-top: 10px; padding: 8px 10px; border-radius: 7px; background: var(--accent-soft); font-size: 12px; }
.note.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--panel-solid); color: var(--fg);
  border-radius: 7px; padding: 7px 10px; font: inherit; }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
.chipf { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.chipf[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mk {
  font: 600 11px/1 var(--f-display); padding: 4px 7px; border-radius: 6px; color: #fff; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); transform: translateY(-8px); position: relative;
}
.mk::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: inherit; }
.mk.done { background: #1e9e57; border-color: #1e9e57; } .mk.prog { background: #d98a00; border-color: #d98a00; }
.mk.pend { background: #6b7886; border-color: #6b7886; } .mk.hl { background: #0f7f9e; border-color: #0f7f9e; }
.mk.bad { background: #d63a2b; border-color: #d63a2b; }
.radio { display: flex; flex-direction: column; gap: 2px; }
.pp-head { font: 600 15px/1.3 var(--f-display); margin-top: 2px; }
.chart { display: block; width: 100%; height: auto; margin-top: 4px; }
.chart .typ { fill: none; stroke: var(--muted); stroke-width: 0.6; }
.chart .day { fill: var(--accent); } .chart .now { fill: var(--warn); }
.chart text { fill: var(--muted); font: 7px var(--f-mono); }
.chart-key { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.chart-key i { display: inline-block; width: 10px; height: 8px; margin-right: 4px; vertical-align: -1px; }
.src { font-size: 11px; color: var(--muted); margin-top: 6px; }
.src a { color: var(--fg); text-decoration-color: var(--accent); }
@media (max-width: 760px) { #card { width: auto; } .odoo-pill .muted { display: none; } #side { top: 112px; } }
</style>

<div id="app">
  <div id="stage" aria-label="3D-модель підприємства"></div>
  <div id="labels"></div>
  <div id="loading">Завантаження моделі…</div>

  <header class="bar">
    <div class="panel brand"><h1>Меблеве підприємство</h1><span class="dims" id="dims"></span></div>
    <button class="panel odoo-pill" id="odoo-pill" title="Джерело даних">
      <span class="live"></span><b>Odoo</b><span id="odoo-state">підключення…</span><span class="muted" id="odoo-time"></span>
    </button>
    <button class="btn" id="toggle-side" aria-expanded="false" aria-controls="side">Види і шари</button>
  </header>

  <nav class="panel" id="side" aria-label="Види і шари">
    <div class="sec">
      <h2>Види</h2>
      <div class="views" id="views"></div>
    </div>
    <div class="sec">
      <h2>Розфарбування</h2>
      <div class="radio">
        <label class="layer"><input type="radio" name="cmode" id="cm-none" value="none" checked><span>Звичайні кольори</span></label>
        <label class="layer"><input type="radio" name="cmode" id="cm-fill" value="fill"><span>Заповненість складу</span></label>
        <label class="layer"><input type="radio" name="cmode" id="cm-oee" value="oee"><span>OEE верстатів</span></label>
        <label class="layer"><input type="radio" name="cmode" id="cm-power" value="power"><span>Споживання електроенергії</span></label>
        <label class="layer"><input type="radio" name="cmode" id="cm-lux" value="lux"><span>Освітленість відносно норми</span></label>
      </div>
    </div>
    <div class="sec">
      <h2>Шари</h2>
      <div class="layers" id="layers"></div>
      <div class="row-btns" style="margin-top:8px">
        <button class="btn" id="all-on">Усі</button>
        <button class="btn" id="all-off">Лише виробництво</button>
        <button class="btn" id="eng-only">Інженерія</button>
      </div>
    </div>
    <div class="sec">
      <h2>Показ</h2>
      <div class="layers">
        <label class="layer"><input type="checkbox" id="opt-labels" checked><span>Підписи</span></label>
        <label class="layer"><input type="checkbox" id="opt-motion" checked><span>Анімація маршруту замовлення</span></label>
        <label class="layer"><input type="checkbox" id="opt-shadows" checked><span>Тіні</span></label>
      </div>
    </div>
  </nav>

  <aside class="panel" id="card" aria-live="polite">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-selected="true">Огляд</button>
      <button class="tab" role="tab" id="tab-production" data-tab="production" aria-selected="false">Виробництво</button>
      <button class="tab" role="tab" id="tab-stock" data-tab="stock" aria-selected="false">Склад</button>
      <button class="tab" role="tab" id="tab-logistics" data-tab="logistics" aria-selected="false">Логістика</button>
      <button class="tab" role="tab" id="tab-energy" data-tab="energy" aria-selected="false">Енергія</button>
    </div>
    <div class="body" id="cardbody"></div>
  </aside>

  <div class="panel" id="help">
    <span><b>ЛКМ</b> обертати</span><span><b>ПКМ</b> зсув</span><span><b>Коліщатко</b> масштаб</span>
    <span><b>Клік</b> вибрати</span><span><b>Подвійний клік</b> наблизити</span><span><b>1–9, 0</b> види · <b>Esc</b> скинути</span>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const MODEL_URL = "factory.glb";
const ODOO_URL = "odoo_demo.json";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s) => document.querySelector(s);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function codeRoot(obj) {
  for (let o = obj; o; o = o.parent) if (o.userData && o.userData.code) return o;
  return null;

function isShown(obj) {
  for (let o = obj; o; o = o.parent) if (!o.visible) return false;

function onModel(gltf) {
  const root = gltf.scene;
  root.traverse((o) => {
    const u = o.userData || {};
    if (u.dims) $("#dims").textContent = u.dims;
    if (u.layer && o.name.startsWith("LAYER_")) layers.set(u.layer, { node: o, label: u.label, group: u.group, order: u.order ?? 99 });
    if (u.code && !items.has(u.code)) items.set(u.code, o);
    if (u.rect) zoneRects.set(u.code, u.rect);
    if (o.isMesh) {
      // свій матеріал на кожен об'єкт, щоб підсвічування не перефарбовувало сусідів
      o.material = o.material.clone();
      o.material.envMapIntensity = 0.45;
      const r = codeRoot(o);
      const kind = r?.userData.kind;
      o.castShadow = !o.material.transparent && kind !== "zone" && kind !== "bin" && !o.name.startsWith("Майданчик");
      o.receiveShadow = !o.material.transparent;
      if (u.role === "status") lamps.push(o);
    }
  });
  scene.add(root);
  const machines = [...items.values()].filter((o) => o.userData.kind === "machine");
  $("#dims").textContent += ` · ${machines.length} ${plural(machines.length, "верстат", "верстати", "верстатів")}`;
  buildLayersUI();
  buildLabels();
  goView(VIEWS[0], false);
  $("#loading").hidden = true;
  modelReady();
}

}

}

function viewPose(v) {
  if (v.pos) return { pos: b2t(v.pos), target: b2t(v.target) };
  let c, size;
  if (v.zone) {
    const [x0, y0, x1, y1] = zoneRects.get(v.zone);
    c = [(x0 + x1) / 2, (y0 + y1) / 2, 0.5];
    size = Math.max(x1 - x0, y1 - y0) * 1.1;
  } else {
    const box = new THREE.Box3().setFromObject(items.get(v.code));
    const ct = box.getCenter(new THREE.Vector3());
    c = [ct.x, -ct.z, 1.0];
    size = box.getSize(new THREE.Vector3()).length() * 0.9;
  }
  const d = new THREE.Vector3(...v.dir).normalize().multiplyScalar(size + 4);
  return { pos: b2t([c[0] + d.x, c[1] + d.y, c[2] + d.z]), target: b2t(c) };
}
let tween = null;
function flyTo(pos, target, animate = true) {
  if (!animate || reduceMotion) {
    camera.position.copy(pos); controls.target.copy(target); controls.update(); tween = null; return;
  }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur: 1000 };
}
function goView(v, animate = true) {
  const { pos, target } = viewPose(v);
  flyTo(pos, target, animate);
  document.querySelectorAll(".view").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.name === v.name)));
}
VIEWS.forEach((v, i) => {
  const b = document.createElement("button");
  b.className = "view"; b.dataset.name = v.name; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `${i < 10 ? `<kbd>${(i + 1) % 10}</kbd>` : ""}${v.name}`;
  b.onclick = () => { goView(v); closeSideOnPhone(); };
  $("#views").appendChild(b);
});
function fitBox(box, animate = true) {
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 2);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < 0.45) { dir.y = 0.45; dir.normalize(); }
  flyTo(c.clone().add(dir.multiplyScalar(r * 2.1 + 4)), c, animate);
  document.querySelectorAll(".view").forEach((b) => b.setAttribute("aria-pressed", "false"));
}
const focusOn = (obj) => fitBox(new THREE.Box3().setFromObject(obj));

const CORE = new Set(["building", "zones", "line", "facade", "buffer", "dust", "people"]);
function setLayer(key, on) {
  const l = layers.get(key);
  if (!l) return;
  l.node.visible = on;

  if (cb) cb.checked = on;

// шари згруповано: заголовок групи вмикає/вимикає всі її шари, стрілка розгортає список
function buildLayersUI() {
  const groups = new Map();
  for (const [key, l] of [...layers].sort((a, b) => a[1].order - b[1].order)) {
    const g = l.group || "Інше";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push([key, l]);
  }
  let gi = 0;
  for (const [g, list] of groups) {
    const box = document.createElement("div");
    box.className = "lgroup";
    const id = `lg-${gi++}`;
    box.innerHTML = `<div class="lg-head">
        <label class="layer"><input type="checkbox" class="lg-all"><span>${esc(g)}</span></label>
        <span class="lg-n"></span>
        <button class="lg-tog" aria-expanded="false" aria-controls="${id}" aria-label="Показати шари групи «${esc(g)}»"></button>
      </div><div class="lg-items" id="${id}" hidden></div>`;
    for (const [key, { label }] of list) {
      const row = document.createElement("label");
      row.className = "layer";
      row.innerHTML = `<input type="checkbox" id="layer-${key}" checked><span>${esc(label)}</span>`;
      row.querySelector("input").onchange = (e) => setLayer(key, e.target.checked);
      box.querySelector(".lg-items").appendChild(row);
    }
    box.querySelector(".lg-all").onchange = (e) => list.forEach(([k]) => setLayer(k, e.target.checked));
    const tog = box.querySelector(".lg-tog");
    tog.onclick = () => {
      const open = tog.getAttribute("aria-expanded") !== "true";
      tog.setAttribute("aria-expanded", String(open));
      box.querySelector(".lg-items").hidden = !open;
    };
    $("#layers").appendChild(box);
  }
  syncLayerGroups();
}
function syncLayerGroups() {
  document.querySelectorAll(".lgroup").forEach((box) => {
    const cbs = [...box.querySelectorAll(".lg-items input")];
    const on = cbs.filter((c) => c.checked).length;
    const all = box.querySelector(".lg-all");
    all.checked = on === cbs.length;
    all.indeterminate = on > 0 && on < cbs.length;
    box.querySelector(".lg-n").textContent = `${on}/${cbs.length}`;
  });
}
$("#all-on").onclick = () => layers.forEach((_, k) => setLayer(k, true));
$("#all-off").onclick = () => layers.forEach((_, k) => setLayer(k, CORE.has(k)));

function buildLabels() {

      addLabel(obj, `<span class="st" style="background:var(--${cls})"></span>${u.label}`, "mach", 0.6);
    }
  }
}
const tmpV = new THREE.Vector3();
function syncLabels() {

  for (const { lbl, obj, cls } of labels) {

// ---------------------------------------------------------------- підсвічування (вибір, наведення, Odoo, режим кольору)
const hl = { roots: new Set(), markers: [], path: null, curve: null };
let colorMode = "none";
const C_OK = new THREE.Color("#27ae60"), C_WARN = new THREE.Color("#f39c12"), C_BAD = new THREE.Color("#e74c3c");
const C_SEL = new THREE.Color("#f2c230"), C_HOV = new THREE.Color("#7fb3d5"), C_HL = new THREE.Color("#18a6c9");
function modeColor(root) {
  if (!D || colorMode === "none") return null;
  const u = root.userData;
  if (colorMode === "fill") {
    const loc = D.locations[u.code];
    if (!loc || loc.fill == null) return null;
    return loc.fill <= 0.001 ? C_BAD : loc.fill < 0.3 ? C_WARN : C_OK;
  }
  if (colorMode === "oee" && u.kind === "machine") {
    const wc = D.workcenters[u.code];
    if (!wc) return null;
    return wc.oee >= 0.75 ? C_OK : wc.oee >= 0.5 ? C_WARN : C_BAD;
  }
  if (colorMode === "lux" && D.lighting) {
    const g = D.lighting.groups[u.code] || (u.kind === "zone" ? lightGroupOfZone(u.code)?.[1] : null);
    if (g) return g.e_calc >= g.e_norm ? C_OK : g.e_calc >= 0.85 * g.e_norm ? C_WARN : C_BAD;
  }
  if (colorMode === "power" && D.energy) {
    const e = D.energy, c = e.consumers[u.code];
    if (c) return c.p_now >= 30 ? C_BAD : c.p_now >= 10 ? C_WARN : C_OK;
    const l = e.lines[u.code] || e.transformers[u.code];
    if (l) return l.load >= 0.8 ? C_BAD : l.load >= 0.6 ? C_WARN : C_OK;
  }
  return null;
}
function paint(root) {
  if (!root) return;
  let color = null, k = 0;
  if (root === selected) { color = C_SEL; k = 0.22; }
  else if (hl.roots.has(root)) { color = C_HL; k = 0.4; }
  else if (root === hovered && root.userData.kind !== "zone") { color = C_HOV; k = 0.18; }
  else { const mc = modeColor(root); if (mc) { color = mc; k = 0.45; } }
  root.traverse((o) => {
    if (o.isMesh && o.userData.role !== "status" && o.material.emissive) {
      o.material.emissive.copy(color || new THREE.Color(0)); o.material.emissiveIntensity = k;
    }
  });
}
function repaintAll() { for (const r of items.values()) paint(r); }
document.querySelectorAll('input[name="cmode"]').forEach((el) => {
  el.onchange = () => { colorMode = el.value; repaintAll(); renderPanel(); };
});

function clearHighlight() {
  const old = [...hl.roots];
  hl.roots.clear();
  old.forEach(paint);
  for (const m of hl.markers) scene.remove(m);
  hl.markers = [];
  if (hl.path) { scene.remove(hl.path); hl.path.geometry.dispose(); hl.path = null; }
  hl.curve = null;
}
function topOf(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  return new THREE.Vector3(c.x, box.max.y, c.z);
}
// entries: [{ code, html, cls }]; path: з'єднати точки в заданому порядку
function highlight(entries, { path = false, fit = true } = {}) {
  clearHighlight();
  const box = new THREE.Box3();
  const pts = [];
  for (const e of entries) {
    const obj = items.get(e.code);
    if (!obj) continue;
    hl.roots.add(obj); paint(obj);
    box.expandByObject(obj);
    const p = topOf(obj);
    if (e.html != null) {
      const el = document.createElement("div");
      el.className = "mk " + (e.cls || "hl");
      el.innerHTML = e.html;
      const m = new CSS2DObject(el);
      m.position.copy(p).add(new THREE.Vector3(0, 0.6, 0));
      scene.add(m); hl.markers.push(m);
    }
    if (path && (!pts.length || pts[pts.length - 1].distanceTo(p) > 0.5)) pts.push(p.clone().add(new THREE.Vector3(0, 1.2, 0)));
  }
  if (path && pts.length > 1) {
    const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
    hl.curve = curve; pulseT = 0;
    hl.path = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 24, 0.14, 8, false),
      new THREE.MeshBasicMaterial({ color: 0xf2c230, transparent: true, opacity: 0.9 }));
    hl.path.userData.isPulse = true;
    scene.add(hl.path);
  }
  if (fit) fitBox(box);
}

// ---------------------------------------------------------------- вибір мишею
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  for (const hit of ray.intersectObjects(scene.children, true)) {
    if (!hit.object.isMesh || !isShown(hit.object) || hit.object.userData.isPulse) continue;
    const root = codeRoot(hit.object);
    if (root) return root;
  }
  return null;
}
function select(obj, { keepHighlight = false } = {}) {
  const prev = selected;
  selected = obj;
  paint(prev);
  if (!keepHighlight) clearHighlight();
  if (obj) {
    paint(obj);
    selBox.box.setFromObject(obj).expandByScalar(0.08);
    selBox.visible = true;
    openView({ type: "object", code: obj.userData.code }, false);
  } else {
    selBox.visible = false;
    if (panel.type === "object") openTab(panel.tab || "overview");
  }
}
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  select(pick(e));
});
renderer.domElement.addEventListener("dblclick", (e) => {
  const o = pick(e);
  if (o) { select(o); focusOn(o); }
});
let hoverAt = 0;
renderer.domElement.addEventListener("pointermove", (e) => {
  if (e.buttons || e.pointerType === "touch") return;
  const now = performance.now();
  if (now - hoverAt < 80) return;
  hoverAt = now;
  const o = pick(e);
  if (o === hovered) return;
  const prev = hovered;
  hovered = o;
  paint(prev); paint(o);
  renderer.domElement.style.cursor = o ? "pointer" : "";
});
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "Escape") { select(null); clearHighlight(); openTab(panel.tab || "overview"); }
  if (/^[0-9]$/.test(e.key)) {
    const v = VIEWS[(parseInt(e.key, 10) + 9) % 10];
    if (v) goView(v);
  }
});

function indexData() {
  idx.mo = new Map(D.productions.map((m) => [m.name, m]));
  idx.pick = new Map(D.pickings.map((p) => [p.name, p]));
  idx.so = new Map(D.sale_orders.map((s) => [s.name, s]));
  idx.po = new Map(D.purchase_orders.map((p) => [p.name, p]));
  idx.mr = new Map(D.maintenance_requests.map((m) => [m.id, m]));
  idx.qc = new Map(D.quality_checks.map((q) => [q.name, q]));
  idx.prodLocs = new Map();
  for (const [code, loc] of Object.entries(D.locations)) {
    for (const q of loc.quants) {
      if (!idx.prodLocs.has(q.product)) idx.prodLocs.set(q.product, []);
      idx.prodLocs.get(q.product).push({ code, qty: q.qty, reserved: q.reserved || 0 });
    }
  }
  idx.truck = new Map(D.pickings.filter((p) => p.truck).map((p) => [p.truck, p.name]));
}
Promise.all([loadOdoo(), modelLoaded]).then(([data]) => {
  D = data;

  simBase = Date.parse(D.meta.now.replace(" ", "T"));
  simStart = Date.now();
  $("#odoo-pill").classList.add("on");
  $("#odoo-state").textContent = "демо-дані";
  tickClock();
  setInterval(tick, 3000);
  setInterval(tickClock, 1000);
  openTab("overview");
}).catch((err) => {

  $("#odoo-state").textContent = "немає даних";

});

const P = (code) => D.products[code] || { name: code, uom: "" };
const qtyU = (q, code) => `${nf.format(q)} ${esc(P(code).uom)}`;
const simNow = () => new Date(simBase + (Date.now() - simStart));
const hm = (s) => (s ? s.slice(11, 16) : "");
const dayHm = (s) => {
  if (!s) return "";
  const today = D.meta.now.slice(0, 10);
  return s.slice(0, 10) === today ? `сьогодні ${s.slice(11, 16)}` : `${s.slice(8, 10)}.${s.slice(5, 7)} ${s.slice(11, 16)}`;
};
function tickClock() {
  if (!D) return;
  const t = simNow();
  $("#odoo-time").textContent = `синхр. ${t.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
}
// «живі» дані: завдання в роботі просуваються, поки сторінка відкрита
function tick() {
  if (!D || document.hidden) return;
  for (const wo of Object.values(D.workorders)) {
    if (wo.state !== "progress" || wo.blocked) continue;
    wo.progress = Math.min(0.98, wo.progress + 0.002 + ((wo.id.charCodeAt(6) % 5) * 0.001));
  }
  for (const mo of D.productions) {
    const w = mo.workorders.map((id) => D.workorders[id]);
    mo.progress = (w.filter((x) => x.state === "done").length + w.filter((x) => x.state === "progress")
      .reduce((s, x) => s + x.progress, 0)) / w.length;
  }
  energyTick();
  updateLive();
  if (colorMode === "power") repaintAll();
}
function updateLive() {
  const val = (key) => {
    const [t, ...rest] = key.split(":");
    const id = rest.join(":");
    return t === "mo" ? idx.mo.get(id)?.progress : D.workorders[id]?.progress;
  };
  document.querySelectorAll("[data-p]").forEach((el) => {
    const v = val(el.dataset.p);
    if (v != null) el.firstElementChild.style.width = barW(v);
  });
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = val(el.dataset.t);
    if (v != null) el.textContent = pct(v);
  });
  document.querySelectorAll("[data-e]").forEach((el) => {
    const v = eVal(el.dataset.e);
    if (v != null) el.textContent = eFmt[el.dataset.ef](v);
  });
  document.querySelectorAll("[data-eb]").forEach((el) => {
    const v = eVal(el.dataset.eb);
    if (v != null) { el.firstElementChild.style.width = barW(v); el.className = `pbar ${loadCls(v)}`; }
  });
}

// ---------------------------------------------------------------- панель
let panel = { type: "tab", tab: "overview" };

}

  b.onclick = () => { select(null); clearHighlight(); openTab(b.dataset.tab); };
});
function openTab(tab) { panel = { type: "tab", tab }; setTabs(tab); renderPanel(); }
function openView(v, scroll = true) {
  panel = { ...v, tab: panel.tab || "overview" };

}
function renderPanel(soft = false) {

    ({ overview: renderOverview, production: renderProduction, stock: renderStock, logistics: renderLogistics,
      energy: renderEnergy })[panel.tab]();

const backBtn = () => `<button class="back" data-back="1">← ${esc(({ overview: "Огляд", production: "Виробництво", stock: "Склад", logistics: "Логістика", energy: "Енергія" })[panel.tab] || "Назад")}</button>`;
// усі посилання в панелі: data-go="mo:…|pick:…|prod:…|obj:…|po:…"
body().addEventListener("click", (e) => {

  const a = e.target.closest("[data-go]");

function renderOverview() {
  setTabs("overview");
  const wcs = Object.values(D.workcenters);

  const oee = wcs.reduce((s, w) => s + w.oee, 0) / wcs.length;
  const today = D.meta.now.slice(0, 10);
  const outs = D.pickings.filter((p) => p.type === "outgoing");
  const ins = D.pickings.filter((p) => p.type === "incoming" && p.scheduled_date.startsWith(today));
  const moProg = D.productions.filter((m) => m.state === "progress").length;
  const attention = [];
  for (const w of wcs) {
    if (w.status === "stop") attention.push(["bad", `${w.name} — зупинено${w.maintenance_request ? ` · ${w.maintenance_request}` : ""}`, `obj:${w.code}`]);
  }
  for (const q of D.quality_checks) if (q.state === "fail") attention.push(["bad", `${q.name}: брак — ${P(q.product).name}`, `obj:${q.location}`]);
  for (const m of D.productions) if (m.reservation_state === "waiting") attention.push(["bad", `${m.name}: бракує компонентів`, `mo:${m.name}`]);
  for (const [k, u] of Object.entries(D.ventilation?.units || {})) {
    if (u.filter_dp_pa > 250) attention.push(["warn", `${k}: забитий фільтр вентиляції (${u.filter_dp_pa} Па) · ${u.maintenance_request || ""}`, `obj:${k}`]);
  }
  for (const w of wcs) if (w.status === "idle") attention.push(["warn", `${w.name} — ${w.idle_reason || "простій"}`, `obj:${w.code}`]);
  for (const p of outs) if (p.state === "waiting") attention.push(["warn", `${p.name} (${p.partner}) — ${p.note}`, `pick:${p.name}`]);
  const lowBins = Object.entries(D.locations).filter(([, l]) => l.state && l.state !== "ok");
  if (lowBins.length) attention.push(["warn", `${lowBins.length} комірок фурнітури нижче мінімуму — закупівлі ${D.purchase_orders.filter((p) => p.locations.length).map((p) => p.name).join(", ")}`, `locs:${lowBins.map(([c]) => c).join(",")}`]);

const nf2 = new Intl.NumberFormat("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf1 = new Intl.NumberFormat("uk-UA", { maximumFractionDigits: 1 });
const kwU = (v) => `${nf1.format(v)} кВт`;
const kwhU = (v) => `${nf1.format(v)} кВт·год`;
const eFmt = {
  kw: kwU, kw0: (v) => `${nf.format(Math.round(v))} кВт`, a: (v) => `${nf.format(Math.round(v))} А`,
  kva: (v) => `${nf.format(Math.round(v))} кВА`, pct,
};
const loadCls = (v) => (v >= 0.8 ? "bad" : v >= 0.6 ? "warn" : "");
// ключ «живого» значення: c:<споживач>:<поле> | l:<лінія>:<поле> | t:<трансформатор>:<поле> | tot:<поле>
function eVal(key) {
  const e = D?.energy;
  if (!e) return null;
  const [t, code, f] = key.split(":");
  if (t === "tot") return e.totals[code];
  const o = t === "c" ? e.consumers[code] : t === "l" ? e.lines[code] : t === "t" ? e.transformers[code] : null;
  return o?.[f];
}
const kpiE = (key, f) => `<b data-e="${esc(key)}" data-ef="${f}">${eFmt[f](eVal(key))}</b>`;
const ev = (key, f) => `<span data-e="${esc(key)}" data-ef="${f}">${eFmt[f](eVal(key))}</span>`;
const ebar = (key) => `<div class="pbar ${loadCls(eVal(key))}" data-eb="${esc(key)}"><i style="width:${barW(eVal(key))}"></i></div>`;
const cosU = (v) => nf2.format(v);
const tanPhi = (c) => Math.tan(Math.acos(c));

// споживання «дихає», поки сторінка відкрита: лічильники оновлюються, суми перераховуються
function energyTick() {
  const e = D.energy;
  if (!e) return;
  for (const c of Object.values(e.consumers)) {
    if (c.status !== "work") continue;
    c.base ??= c.p_now;
    c.p_now = Math.round(c.base * (0.94 + Math.random() * 0.12) * 10) / 10;
    c.i_now = Math.round((c.p_now * 1000) / (Math.sqrt(3) * 400 * c.cos_phi));
  }
  for (const ln of Object.values(e.lines)) {
    const cs = ln.consumers.map((k) => e.consumers[k]);
    const p = cs.reduce((s, c) => s + c.p_now, 0), q = cs.reduce((s, c) => s + c.p_now * tanPhi(c.cos_phi), 0);
    ln.p_now = Math.round(p * 10) / 10;
    ln.i_now = Math.round((Math.hypot(p, q) * 1000) / (Math.sqrt(3) * 400));
    ln.load = ln.i_now / ln.rating_a;
  }
  for (const t of Object.values(e.transformers)) {
    const p = Object.values(e.lines).filter((l) => e.cells[l.cell].section === t.section).reduce((s, l) => s + l.p_now, 0);
    t.p_kw = Math.round(p * 10) / 10;
    t.s_kva = Math.round(p / t.cos_phi);
    t.load = t.s_kva / t.rating_kva;
    t.i_a = Math.round((t.s_kva * 1000) / (Math.sqrt(3) * 400));
    Object.assign(e.cells[t.incomer], { i_now: t.i_a, p_now: t.p_kw });
  }
  for (const c of Object.values(e.cells)) if (c.line) Object.assign(c, { i_now: e.lines[c.line].i_now, p_now: e.lines[c.line].p_now });
  const ts = Object.values(e.transformers);
  e.totals.p_now = ts.reduce((s, t) => s + t.p_kw, 0);
  e.totals.s_now = ts.reduce((s, t) => s + t.s_kva, 0);
}

// стовпчики кВт·год по годинах: сьогодні (заливка) поверх типового робочого дня (контур)
function chartHtml(today, typical) {
  const max = Math.max(...typical, ...today.filter((v) => v != null)) * 1.08;
  const H = 70, w = 10, nowH = today.findLastIndex((v) => v != null);
  const y = (v) => H - (v / max) * H;
  const bars = typical.map((t, h) => {
    const v = today[h];
    return `<rect class="typ" x="${h * w + 1.5}" y="${y(t)}" width="${w - 3}" height="${H - y(t)}"><title>${String(h).padStart(2, "0")}:00 · типовий день ${nf.format(t)} кВт·год</title></rect>`
      + (v != null ? `<rect class="${h === nowH ? "now" : "day"}" x="${h * w + 2.5}" y="${y(v)}" width="${w - 5}" height="${H - y(v)}"><title>${String(h).padStart(2, "0")}:00 · сьогодні ${nf.format(v)} кВт·год${h === nowH ? " (година триває)" : ""}</title></rect>` : "");
  }).join("");
  const ticks = [0, 6, 12, 18, 24].map((h) => `<text x="${Math.min(h * w, 232)}" y="${H + 9}">${String(h).padStart(2, "0")}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 240 ${H + 11}" role="img" aria-label="Споживання по годинах">${bars}${ticks}</svg>
    <div class="chart-key"><span><i style="background:var(--accent)"></i>сьогодні</span><span><i style="border:1px solid var(--muted)"></i>типовий робочий день</span></div>`;
}

        <tr><td><b>Разом</b></td><td class="n"><b>${nf.format(hb.total)} кВт</b></td></tr>
        <tr><td>Два котли</td><td class="n">${nf.format(hb.capacity)} кВт · запас ${pct(hb.reserve)}</td></tr></table>
      <div class="src">${esc(hb.note)}</div>` : ""}
      <div class="sub">Споживачі тепла</div>
      <table class="tbl"><tr><th>Установка</th><th class="n">Клапан</th><th class="n">кВт</th></tr>
        ${us.map(([k, u]) => `<tr class="click" data-go="obj:${esc(k)}"><td>${esc(k)} · ${esc(D.zones[u.zone]?.name || u.zone)}</td>
          <td class="n">${pct(u.heating_valve)}</td><td class="n">${nf1.format(u.heat_kw)}</td></tr>`).join("")}</table>`;
  }
  const u = V.units[code];
  if (!u) return "";
  const rows = [["Зона", `<button class="lnk" data-go="obj:${esc(u.zone)}">${esc(D.zones[u.zone]?.name || u.zone)}</button>`], ["Режим", esc(u.mode)],
    ["Витрата", `${nf.format(u.airflow_m3h)} з ${nf.format(u.airflow_nom)} м³/год ${bar(u.airflow_nom ? u.airflow_m3h / u.airflow_nom : 0, "flow")}`]];
  if (u.supply_c != null) rows.push(["Приплив", `${nf1.format(u.supply_c)} °C`]);
  if (u.indoor_c != null) rows.push(["У зоні", `${nf1.format(u.indoor_c)} °C`]);
  if (u.heating_valve != null) rows.push(["Клапан нагріву", `${pct(u.heating_valve)} · ${nf1.format(u.heat_kw)} кВт тепла`]);
  if (u.filter_dp_pa != null) rows.push(["Фільтр", `${u.filter_dp_pa} Па ${u.filter_dp_pa > 250 ? pill(["warn", "замінити"]) : ""}`]);
  rows.push(["Вентилятори", `${kwU(u.p_now)} з ${kwU(u.p_inst)}`]);
  const mr = u.maintenance_request ? idx.mr.get(u.maintenance_request) : null;
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${u.note ? `<div class="note">${esc(u.note)}</div>` : ""}
    ${mr ? `<div class="note bad"><b>${esc(mr.id)}</b> · ${esc(mr.name)}</div>` : ""}`;
}

// ---------------------------------------------------------------- телефон
function closeSideOnPhone() {
  if (matchMedia("(max-width: 760px)").matches) { $("#side").classList.remove("open"); $("#toggle-side").setAttribute("aria-expanded", "false"); }
}
$("#toggle-side").onclick = () => {
  const open = $("#side").classList.toggle("open");
  $("#toggle-side").setAttribute("aria-expanded", String(open));
};

// ---------------------------------------------------------------- цикл
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = performance.now();
  if (tween) {
    const k = Math.min((now - tween.start) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k === 1) tween = null;
  }
  controls.update();
  const blink = 0.5 + 0.5 * Math.sin(now / 220);
  for (const l of lamps) {
    const st = codeRoot(l)?.userData.status;
    l.material.emissive.set(l.material.color);
    l.material.emissiveIntensity = st === "stop" ? (reduceMotion ? 0.8 : 0.2 + blink) : st === "work" ? 0.7 : 0.3;
  }
  pulse.visible = !!(hl.curve && $("#opt-motion").checked);
  if (pulse.visible) {
    pulseT = (pulseT + dt * 0.12) % 1;
    pulse.position.copy(hl.curve.getPointAt(pulseT));
  }
  syncLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
