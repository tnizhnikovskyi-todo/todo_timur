[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot_sim"
version = "0.1.0"
description = "Емулятор обладнання factory3d"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
iot-sim = "iot_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["iot_sim*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
markers = ["stand: тести проти compose-стенду", "unit: юніт-тести без мережі"]
addopts = "-m 'not stand'"
