[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "td-collector-energy"
version = "0.1.0"
description = "Плагін колектора factory3d: автоматика енергетики й виконавець команд (energy_ctl)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "jsonschema==4.23.0"]

[project.entry-points."factory3d_collector.plugins"]
energy_ctl = "td_collector_energy:EnergyCtlPlugin"

[tool.setuptools.packages.find]
include = ["td_collector_energy*"]

[tool.setuptools.package-data]
td_collector_energy = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["stand: потребує стенда (emulator + collector + Odoo)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
