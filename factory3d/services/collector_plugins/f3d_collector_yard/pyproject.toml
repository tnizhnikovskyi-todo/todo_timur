[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f3d-collector-yard"
version = "0.1.1"
description = "Плагін колектора factory3d: автоваги SICS (MT-SICS)"
requires-python = ">=3.12"
dependencies = ["f3d_collector>=0.1.0"]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "jsonschema==4.23.0"]

[project.entry-points."factory3d_collector.plugins"]
sics = "f3d_collector_yard.sics:SicsPlugin"

[tool.setuptools.packages.find]
include = ["f3d_collector_yard*"]

[tool.setuptools.package-data]
f3d_collector_yard = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
