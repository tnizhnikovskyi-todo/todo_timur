# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "B-02",
 "checks": [
  {
   "id": "script-check-fit-gap",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-client-delivery>/skills/package-fit-gap/scripts/check_fit_gap.py --client <к> --tag <тег> --base <git.base> [--forbidden <файл>]: FG-class, FG-hours, FG-anchor, FG-source, FG-schema, FG-pii, FG-headings, FG-ignore, FG-scope без FAIL (частку відповідності показано без порога; --business-case застарілий — приймається й ігнорується). Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "fg-headings",
   "prim": "manual",
   "args": {
    "text": "FG-headings: Джерела, Вимоги, Суперечності й відкриті питання, Рішення з сесій, Запити в D-02, Відповідність пакету, Факти для пілоту (clients/<к>/fit-gap.md)",
    "who": "runner"
   }
  },
  {
   "id": "fg-agreement",
   "prim": "manual",
   "args": {
    "text": "FG-agreement: угода про discovery з двома підписами з датами й пунктом про AI",
    "who": "Керівник напряму"
   }
  },
  {
   "id": "fg-coverage",
   "prim": "manual",
   "args": {
    "text": "FG-coverage: кожен запис журналу/наряду оброблено N/N; FG-d02: кожне «уточнити» з причиною «дефект» має рядок запиту D-02",
    "who": "runner"
   }
  },
  {
   "id": "human-decision",
   "prim": "manual",
   "args": {
    "text": "шлюз «Пакет підходить?» — кнопка Керівника напряму",
    "who": "Керівник напряму"
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py <where>: REJ-exists, REJ-fields, REJ-count без FAIL. Відкинуті вимоги/«не з пакета» — розділ «## Не робимо» (або «## Відкинуто») у fit-gap.md. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "<where>"
    ],
    "who": "runner"
   }
  }
 ]
}
