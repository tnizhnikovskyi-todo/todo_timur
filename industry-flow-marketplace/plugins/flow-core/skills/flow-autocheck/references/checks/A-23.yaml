# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "A-23",
 "checks": [
  {
   "id": "mailing-list-exists",
   "when": "mode:список",
   "prim": "manual",
   "args": {
    "text": "непорожній mailing-list.csv у where наряду (docs/industries/<галузь>/demand/)",
    "who": "runner"
   }
  },
  {
   "id": "params-mode-set",
   "prim": "manual",
   "args": {
    "text": "params.mode наряду задано (список|адреси|prep|results); без нього перевірки з when дають SKIP",
    "who": "runner"
   }
  },
  {
   "id": "dt-structure",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "DT-inputs, DT-thresholds (6 заголовків thresholds.md і числа Р3, Р4, Р5а, Р5б, рядок «Тривалість:»), DT-variants (2–3 варіанти, ≥2 F-xx на варіант), DT-reach, DT-wave (prep); DT-frozen, DT-levels, DT-featmap, DT-hot, DT-trace (results)",
    "who": "runner"
   }
  },
  {
   "id": "dt-honesty",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/demand-test-runner/scripts/demand_tool.py honesty landing.md emails.md — без заборонених фраз, є «Прототип» і «пілот з» Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "dt-complexity",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/demand-test-runner/scripts/demand_tool.py complexity --complexity <complexity.md> --landing landing.md — F-xx «код/складно» мають «у плані пілоту» Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "dt-utm",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/demand-test-runner/scripts/demand_tool.py utm landing.md emails.md — utm_campaign, utm_content, utm_term=F-xx на #F-xx Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "dt-no-pii",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/demand-test-runner/scripts/demand_tool.py pii <файли, які пише скіл, і _input/*> (mailing-list.* не перевіряється) Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "dt-consent",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "DT-consent: у кожному листі відписка й відправник; у формі текст згоди, не плейсхолдер",
    "who": "Юрист"
   }
  },
  {
   "id": "human-thresholds",
   "when": "mode:prep|results",
   "prim": "manual",
   "args": {
    "text": "пороги ставить AI, власник міг заперечити до старту розсилки (окремого затвердження немає); пороги не змінені після старту; сигнали Р3–Р5 пораховані окремо від кліків; карта інтересу прив'язана до F-xx A-20",
    "who": "runner"
   }
  },
  {
   "id": "recommendation-heading",
   "when": "mode:results",
   "prim": "headings",
   "args": {
    "ref": "head:docs/industries/<галузь>/demand/results.md",
    "headings": [
     "re:рекомендація ai для a-07"
    ]
   }
  },
  {
   "id": "no-money",
   "when": "mode:results",
   "prim": "no_money",
   "args": {
    "paths": [
     "docs/industries/<галузь>/demand/results.md"
    ]
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py docs/industries/<галузь>/demand/thresholds.md: REJ-exists, REJ-fields, REJ-count без FAIL. Відкинуті варіанти цінності/сегменти — розділ «## Не робимо» (або «## Відкинуто») в demand/thresholds.md. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "docs/industries/<галузь>/demand/thresholds.md"
    ],
    "who": "runner"
   },
   "when": "mode:prep|results"
  },
  {
   "id": "script-check-facts",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py docs/industries/<галузь>/research/facts.yaml docs/industries/<галузь>/demand/landing.md docs/industries/<галузь>/demand/thresholds.md: FACT-mismatch, FACT-orphan без FAIL. Числа позначаються маркером <!--fact:ключ--> (docstring скрипта); FACT-orphan WARN не блокує. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py",
     "docs/industries/<галузь>/research/facts.yaml",
     "docs/industries/<галузь>/demand/landing.md",
     "docs/industries/<галузь>/demand/thresholds.md"
    ],
    "who": "runner"
   },
   "when": "mode:prep|results"
  }
 ]
}
