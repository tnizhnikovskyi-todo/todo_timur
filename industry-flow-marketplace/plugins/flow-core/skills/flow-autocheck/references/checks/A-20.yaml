# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "A-20",
 "inputs_require": [
  "OWNER-INTAKE.md"
 ],
 "checks": [
  {
   "id": "depends-exists",
   "prim": "exists",
   "args": {
    "paths": [
     "docs/industries/<галузь>/research/DEPENDS.yaml"
    ]
   }
  },
  {
   "id": "script-check-concept",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/concept-mapper/scripts/check_concept.py docs/industries/<галузь>/concept --input briefing.md=docs/industries/<галузь>/briefing.md --input past-projects.md=docs/industries/<галузь>/past-projects.md --base <git.base> --research docs/industries/<галузь>/research --intake docs/industries/<галузь>/OWNER-INTAKE.md --k1 docs/industries/<галузь>/research/K1.md --facts docs/industries/<галузь>/research/facts.yaml --autocheck-dir <корінь плагіна flow-core>/skills/flow-autocheck/scripts [--input protocol-<ід>-<дата>.md=<шлях>, якщо протокол названо в inputs]: CM-args, CM-files, CM-src, CM-quote, CM-feat, CM-count, CM-trace, CM-signal, CM-ids, CM-pii, CM-scope, CM-research, CM-buyer, CM-roles-scenarios, CM-base-edition, CM-dnr, CM-facts без FAIL (без --research/--intake скрипт дає CM-args = FAIL; режим --concept-only для A-20 не використовувати). Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-research>/skills/concept-mapper/scripts/check_concept.py",
     "docs/industries/<галузь>/concept",
     "--input",
     "briefing.md=docs/industries/<галузь>/briefing.md",
     "--input",
     "past-projects.md=docs/industries/<галузь>/past-projects.md",
     "--base",
     "<git.base>",
     "--research",
     "docs/industries/<галузь>/research",
     "--intake",
     "docs/industries/<галузь>/OWNER-INTAKE.md",
     "--k1",
     "docs/industries/<галузь>/research/K1.md",
     "--facts",
     "docs/industries/<галузь>/research/facts.yaml",
     "--autocheck-dir",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts"
    ]
   }
  },
  {
   "id": "cm-pii-fio",
   "prim": "manual",
   "args": {
    "text": "CM-pii: ПІБ-подібні рядки (три слова з великої) перевірено очима",
    "who": "Власник продукту"
   }
  },
  {
   "id": "human-spot",
   "prim": "manual",
   "args": {
    "text": "3 вибіркові функції: біль і цитата справді з джерела; ролі повні; екрани й сценарії зрозумілі клієнту",
    "who": "Власник продукту"
   }
  },
  {
   "id": "intake-exists",
   "prim": "exists",
   "args": {
    "paths": [
     "docs/industries/<галузь>/OWNER-INTAKE.md"
    ]
   }
  },
  {
   "id": "script-check-intake",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_intake.py docs/industries/<галузь>/OWNER-INTAKE.md --brief docs/industries/<галузь>/research/OWNER-BRIEF.md: INT-file, INT-block, INT-dup без FAIL. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_intake.py",
     "docs/industries/<галузь>/OWNER-INTAKE.md",
     "--brief",
     "docs/industries/<галузь>/research/OWNER-BRIEF.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "owner-brief-headings",
   "prim": "headings",
   "args": {
    "ref": "head:docs/industries/<галузь>/research/OWNER-BRIEF.md",
    "headings": [
     "re:для кого і який біль",
     "re:наскрізний сценарій",
     "re:екрани",
     "re:ланцюг",
     "re:що свідомо не робимо",
     "re:гроші",
     "re:головні ризики",
     "re:рішення власника",
     "re:подивитися самому",
     "re:коробка, запуск і продаж"
    ]
   }
  },
  {
   "id": "box-headings",
   "prim": "headings",
   "args": {
    "ref": "head:docs/industries/<галузь>/research/BOX.md",
    "headings": [
     "re:коробки й тарифи",
     "re:план запуску",
     "re:довідники й майстер-дані",
     "re:модель даних",
     "re:ролі доступу",
     "re:нефункціональні",
     "re:структура модулів"
    ]
   }
  },
  {
   "id": "sales-headings",
   "prim": "headings",
   "args": {
    "ref": "head:docs/industries/<галузь>/research/SALES.md",
    "headings": [
     "re:хто купує",
     "re:заперечення",
     "re:вартість володіння",
     "re:тест\\w* попиту",
     "re:пілот",
     "re:демо-сценарій",
     "re:замінники доказу"
    ]
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py docs/industries/<галузь>/research/REJECTED.md --intake docs/industries/<галузь>/OWNER-INTAKE.md --k1 docs/industries/<галузь>/research/K1.md: REJ-exists, REJ-fields, REJ-dnr, REJ-count без FAIL. Крок із переліку відбору без реєстру відкинутого (або з «нічого не відкинуто» без рядка) — FAIL (flow-core/references/rejected-register.md). Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "docs/industries/<галузь>/research/REJECTED.md",
     "--intake",
     "docs/industries/<галузь>/OWNER-INTAKE.md",
     "--k1",
     "docs/industries/<галузь>/research/K1.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "script-check-edition-claims",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-research>/skills/industry-deep-dive/scripts/check_edition_claims.py docs/industries/<галузь>/research/edition-claims.md: EC-verdict, EC-evidence, EC-partial без FAIL. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-research>/skills/industry-deep-dive/scripts/check_edition_claims.py",
     "docs/industries/<галузь>/research/edition-claims.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "script-check-facts",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py docs/industries/<галузь>/research/facts.yaml docs/industries/<галузь>/research/OWNER-BRIEF.md docs/industries/<галузь>/research/BOX.md docs/industries/<галузь>/research/SALES.md: FACT-mismatch, FACT-orphan без FAIL. Числа позначаються маркером <!--fact:ключ--> (docstring скрипта); FACT-orphan WARN не блокує. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py",
     "docs/industries/<галузь>/research/facts.yaml",
     "docs/industries/<галузь>/research/OWNER-BRIEF.md",
     "docs/industries/<галузь>/research/BOX.md",
     "docs/industries/<галузь>/research/SALES.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "script-check-facts-markers",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py docs/industries/<галузь>/research/facts.yaml docs/industries/<галузь>/research/OWNER-BRIEF.md docs/industries/<галузь>/research/BOX.md docs/industries/<галузь>/research/SALES.md --require-markers: FACT-markers, FACT-orphan без FAIL. Кожен файл із числами (грн, %, год…) мусить мати маркери <!--fact:ключ--> / data-fact (checks.md, «Маркери фактів»).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_facts.py",
     "docs/industries/<галузь>/research/facts.yaml",
     "docs/industries/<галузь>/research/OWNER-BRIEF.md",
     "docs/industries/<галузь>/research/BOX.md",
     "docs/industries/<галузь>/research/SALES.md",
     "--require-markers"
    ],
    "who": "runner"
   }
  },
  {
   "id": "script-check-privacy",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_privacy.py docs/industries/<галузь>/research --allow <корінь плагіна flow-research>/references/brand-todo/BRAND.md: PRV-pii, PRV-raw-place без FAIL. ПІБ-подібне (MANUAL) — перевірка очима. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими). Сирі цитати без маркера internal-raw скрипт не бачить — рецензент перевіряє очима; коди клієнтів K-xx/П-xx у публічних сторінках і матеріалах дають FAIL PRV-client-code.",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_privacy.py",
     "docs/industries/<галузь>/research",
     "--allow",
     "<корінь плагіна flow-research>/references/brand-todo/BRAND.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "concept-vs-intake",
   "prim": "manual",
   "args": {
    "text": "рекомендація AI не суперечить анкеті (редакції, амбіція, ICP, тарифи); розбіжність показано власнику, анкету не переможено (С-01); брак болів/розмітки — ризик у план A-23, не стоп (К-01)",
    "who": "Власник продукту"
   }
  },
  {
   "id": "script-check-stale",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_stale.py docs/industries/<галузь>/research/DEPENDS.yaml --base <git.head>: STALE-list без FAIL. Після перерахунку список має бути порожній. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_stale.py",
     "docs/industries/<галузь>/research/DEPENDS.yaml",
     "--base",
     "<git.head>"
    ],
    "who": "runner"
   }
  }
 ]
}
