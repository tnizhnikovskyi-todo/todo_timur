# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "A-15",
 "extra_allowed": ["tests/reports/", "docs/industries/*/research/AI-DECISIONS.md", "package/templates/demo-README.md"],
 "checks": [
  {
   "id": "demo-readme",
   "prim": "exists",
   "args": {
    "paths": [
     "package/demo/README.md"
    ]
   }
  },
  {
   "id": "scope-demo",
   "prim": "git_diff_allowed",
   "args": {
    "from": "base",
    "to": "head",
    "allow": [
     "package/demo/",
     "package/templates/demo-README.md",
     "docs/industries/*/research/AI-DECISIONS.md",
     "observations/"
    ]
   }
  },
  {
   "id": "readme-sections",
   "prim": "headings",
   "args": {
    "ref": "head:package/demo/README.md",
    "headings": [
     "Адреса стенда",
     "Ревізія package/",
     "Команда підйому з нуля",
     "Команда скидання",
     "Режим використання стенда",
     "Демо-ролі й логіни",
     "Склад демо-даних",
     "Файл answers.yaml і профілі",
     "Журнал установки",
     "Виправлення стенда/демо-даних"
    ]
   }
  },
  {
   "id": "no-db-binaries-tree",
   "prim": "no_db_binaries",
   "route_on_fail": "A-15 (прибрати бази з package/ через git rm, .gitignore; для refresh — теж git rm, див. demo-base-builder п. 10а/13)",
   "args": {
    "tree": "package/"
   }
  },
  {
   "id": "no-pii-demo",
   "prim": "pii_strict",
   "args": {
    "paths": [
     "package/demo/"
    ]
   }
  },
  {
   "id": "sha-rule",
   "prim": "manual",
   "args": {
    "text": "SHA у README = SHA package/CHECKS.md або його нащадок; суть: не змінено package/addons, package/config, package/master-data; службові шляхи тестового репо (.claude/, industry-flow-marketplace/, CLAUDE.md, TEST-START.md, START-HERE.md) не рахуються; diff CHECKS..HEAD лише в package/CHECKS.md, package/demo/**, package/ACCEPTANCE.md, package/docs/user-guide/**, AI-DECISIONS, flow/**, tests/**, observations/ (як diff-checks-acc A-17); модулі, конфіг і майстер-дані не змінені",
    "who": "runner"
   }
  },
  {
   "id": "synthetic-data",
   "prim": "manual",
   "args": {
    "text": "demo-data-rules.md: e-mail лише example.com, назви «Демо-…», збігів із реальними назвами немає",
    "who": "runner"
   }
  },
  {
   "id": "stand-live",
   "prim": "manual",
   "args": {
    "text": "up-from-scratch (up.sh на чистій базі, exit 0), modules-installed, config-answers, answers-schema, profiles-coverage, reset — на стенді; connection_id явний, база з allow-list",
    "who": "runner"
   }
  },
  {
   "id": "human-stand",
   "prim": "manual",
   "args": {
    "text": "адреса відкривається, пам'ятка Тімліда виконана",
    "who": "Тімлід"
   }
  }
 ]
}
