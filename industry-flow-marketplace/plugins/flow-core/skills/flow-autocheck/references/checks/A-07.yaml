# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "A-07",
 "checks": [
  {
   "id": "results-exists",
   "prim": "exists",
   "args": {
    "paths": [
     "docs/industries/<галузь>/demand/results.md"
    ]
   }
  },
  {
   "id": "recommendation-heading",
   "prim": "headings",
   "args": {
    "ref": "head:docs/industries/<галузь>/demand/results.md",
    "headings": [
     "re:рекомендація ai для a-07"
    ]
   }
  },
  {
   "id": "no-money",
   "prim": "no_money",
   "args": {
    "paths": [
     "docs/industries/<галузь>/demand/results.md"
    ]
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py docs/industries/<галузь>/demand/results.md: REJ-exists, REJ-fields, REJ-count без FAIL. Відкинуті варіанти — розділ «## Не робимо» (або «## Відкинуто») у demand/results.md. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "docs/industries/<галузь>/demand/results.md"
    ],
    "who": "runner"
   }
  },
  {
   "id": "recommendation-basis",
   "prim": "manual",
   "args": {
    "text": "«Рекомендація AI для A-07» (будуємо / ні / змінити концепцію) спирається на сигнали й пороги A-23 (thresholds.md), без business-case, окупності й грошового розрахунку (0.3.0; business-case.md не пишеться)",
    "who": "runner"
   }
  },
  {
   "id": "signature",
   "prim": "manual",
   "args": {
    "text": "рішення «будуємо / ні / змінити концепцію» — кнопка людини (Власник продукту; вето за рекомендацією AI); AI його не ставить і не вписує",
    "who": "Власник продукту"
   }
  }
 ]
}
