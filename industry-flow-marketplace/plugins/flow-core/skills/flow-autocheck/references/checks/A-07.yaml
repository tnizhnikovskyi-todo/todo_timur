# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "A-07",
 "checks": [
  {
   "id": "headings",
   "prim": "manual",
   "args": {
    "text": "заголовки business-case.md (шаблон product-decision-drafter/references/business-case.md) на місці; шлях залежить від галузі (`docs/industries/<галузь>/business-case.md`)",
    "who": "runner"
   }
  },
  {
   "id": "fields-empty",
   "prim": "manual",
