# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "B-01",
 "checks": [
  {
   "id": "ss-leads",
   "prim": "manual",
   "args": {
    "text": "SS-registry, SS-unique, SS-exclude, SS-size (≤ size; до D-05 лише пілотні), SS-tag, SS-pii: кожен лід має ЄДРПОУ з odb-catalog (has_financials=1) у сегменті A-02; контактів і адрес у репо немає",
    "who": "runner"
   }
  },
  {
   "id": "human-review",
   "prim": "manual",
   "args": {
    "text": "перевірка списку лідів",
    "who": "Керівник напряму"
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py <where>: REJ-exists, REJ-fields, REJ-dnr, REJ-count без FAIL. Відкинуті ліди — розділ «## Відкинуто» у файлі з where. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "<where>"
    ],
    "who": "runner"
   }
  }
 ]
}
