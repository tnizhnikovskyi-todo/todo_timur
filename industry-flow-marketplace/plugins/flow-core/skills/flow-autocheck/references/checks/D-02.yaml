# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "D-02",
 "checks": [
  {
   "id": "backlog",
   "prim": "exists",
   "args": {
    "paths": [
     "package/backlog.md"
    ]
   }
  },
  {
   "id": "backlog-headers",
   "prim": "headings",
   "args": {
    "ref": "head:package/backlog.md",
    "headings": [
     "Заголовний блок",
     "Запити",
     "Групи",
     "Причини відмов",
     "Без ID джерела",
     "Рішення Власника продукту",
     "Журнал запусків"
    ]
   }
  },
  {
   "id": "script-backlog-check",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-package-evolution>/skills/backlog-triage/scripts/backlog_check.py --selftest; потім --phase draft --backlog package/backlog.md [--base <git.base-копія>] --sources <extracted.json> [--mode b|c|d --trigger-ref <шлях>] [--rerun]; після підпису — --phase post-sign --src-old <тека> --src-new <тека>: BT-* без FAIL. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "bt-pii",
   "prim": "manual",
   "args": {
    "text": "BT-pii: ПІБ-подібні рядки в описових клітинках — перевірка очима",
    "who": "runner"
   }
  },
  {
   "id": "human-decision",
   "prim": "manual",
   "args": {
    "text": "рішення «у продукт / у кастом» вписує людина",
    "who": "Власник продукту"
   }
  },
  {
   "id": "rejected-register",
   "prim": "manual",
   "args": {
    "text": "python3 -I <корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py package/backlog.md: REJ-exists, REJ-fields, REJ-dnr, REJ-count без FAIL. REQ «відхилити» — розділ «## Відкинуто» у package/backlog.md. Скрипт autocheck.py його не запускає: має виконати runner (виконує runner за flow-step-runner, Крок 9 (ж); не виконано → ERROR, не PASS), JSON вставляється у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "cmd": [
     "python3",
     "-I",
     "<корінь плагіна flow-core>/skills/flow-autocheck/scripts/check_rejected.py",
     "package/backlog.md"
    ],
    "who": "runner"
   }
  }
 ]
}
