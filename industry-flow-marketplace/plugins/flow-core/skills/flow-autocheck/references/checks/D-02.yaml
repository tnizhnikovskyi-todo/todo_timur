# Специфікація перевірок кроку; синтаксис JSON (валідний YAML 1.2). Контракт — ../checks.md
{
 "step": "D-02",
 "checks": [
  {
   "id": "backlog",
   "prim": "exists",
   "args": {
    "paths": [
     "package/backlog.md"
    ]
   }
  },
  {
   "id": "backlog-headers",
   "prim": "headings",
   "args": {
    "ref": "head:package/backlog.md",
    "headings": [
     "Заголовний блок",
     "Запити",
     "Групи",
     "Причини відмов",
     "Без ID джерела",
     "Рішення Власника продукту",
     "Журнал запусків"
    ]
   }
  },
  {
   "id": "scope-backlog",
   "prim": "git_diff_allowed",
   "args": {
    "from": "base",
    "to": "head",
    "allow": [
     "package/backlog.md"
    ]
   }
  },
  {
   "id": "signature-by-ai-backlog",
   "prim": "signature_by_ai",
   "args": {
    "file": "package/backlog.md",
    "heading": "(?i)рішення власника продукту"
   }
  },
  {
   "id": "script-backlog-check",
   "prim": "manual",
   "args": {
    "text": "python3 -I plugins/flow-package-evolution/skills/backlog-triage/scripts/backlog_check.py --selftest; потім --phase draft --backlog package/backlog.md [--base <git.base-копія>] --sources <extracted.json> [--mode b|c|d --trigger-ref <шлях>] [--rerun]; після підпису — --phase post-sign --src-old <тека> --src-new <тека>: BT-* без FAIL. Скрипт autocheck.py його не запускає: runner виконує команду й вставляє JSON у checks[] (FAIL скрипта = FAIL кроку, MANUAL і SKIP лишаються такими).",
    "who": "runner"
   }
  },
  {
   "id": "bt-pii",
   "prim": "manual",
   "args": {
    "text": "BT-pii: ПІБ-подібні рядки в описових клітинках — перевірка очима",
    "who": "runner"
   }
  },
  {
   "id": "human-decision",
   "prim": "manual",
   "args": {
    "text": "рішення «у продукт / у кастом» вписує людина",
    "who": "Власник продукту"
   }
  }
 ]
}
