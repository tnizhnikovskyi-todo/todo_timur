# Скелет .github/workflows/ci.yml для C-03. Плейсхолдери {{...}} агент замінює фактами (кроки 2-3 SKILL.md).
# Нерозв'язаний {{...}} у результаті = FAIL check_ci.py. Нічого не вигадувати: чого не знаєш - memo + ескалація.
# Фільтрів paths у on: НЕМАЄ навмисно: required check `ci` не має зависати на PR поза зонами пакета/клієнтів;
# обсяг прогону визначає job resolve (git diff); змін у зонах немає - ci зелений з текстом "нічого запускати".
name: ci
run-name: "ci ${{ inputs.sha || github.sha }} client=${{ inputs.client || '-' }} tag=${{ inputs.package_tag || '-' }}"

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_tag: {description: "Тег пакета; порожньо - тег клієнта з REGISTRY.md", required: false, default: ""}
      client:      {description: "Ідентифікатор клієнта (DATA_POLICY)", required: false, default: ""}
      odoo_version: {description: "Версія Odoo; порожньо - із суфікса тега/гілки, інакше 19", required: false, default: ""}
      sha:         {description: "SHA для перевірки; порожньо - HEAD гілки", required: false, default: ""}
      odoo_task:   {description: "id задачі Odoo для звіту (необов'язково)", required: false, default: ""}
      edition:     {description: "Редакція Odoo: ce | ee | both; порожньо - both (CE-ядро + EE-підсилення td_*_ee)", required: false, default: ""}

concurrency:
  # push і dispatch групуються за SHA й не скасовуються (A-14 не має прочитати cancelled як червоне); скасування лише старіших PR-прогонів
  group: ci-${{ github.event_name == 'pull_request' && github.ref || inputs.sha || github.sha }}-${{ inputs.client || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      run_package: ${{ steps.r.outputs.run_package }}
      run_config: ${{ steps.r.outputs.run_config }}
      clients: ${{ steps.r.outputs.clients }}        # JSON: [{"id":"k01","tag":"v1.1"}]
      odoo_version: ${{ steps.r.outputs.odoo_version }}
      odoo_supported: ${{ steps.r.outputs.odoo_supported }}
      editions: ${{ steps.r.outputs.editions }}      # JSON: ["ce","ee"] | ["ce"] | ["ee"]; порожнього значення не буває (див. нижче)
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ inputs.sha || github.sha }}", fetch-depth: 0}
      - id: r
        env:   # event-поля лише через env, не в тексті run:
          IN_TAG: ${{ inputs.package_tag }}
          IN_CLIENT: ${{ inputs.client }}
          IN_ODOO: ${{ inputs.odoo_version }}
          IN_EDITION: ${{ inputs.edition }}
          IN_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # {{RESOLVE}}: (1) sha = IN_SHA або HEAD; (2) diff проти BASE_REF/BEFORE -> run_package/run_config/clients;
          # (3) клієнти: dispatch -> IN_CLIENT; тег = IN_TAG, інакше з clients/REGISTRY.md (тег-кандидат пріоритетний)
          #     {{REGISTRY_PARSE}} - за фактичним форматом файла; (4) odoo_version за references/odoo-version-resolve.md;
          # BEFORE з одних нулів (перший push нової гілки upgrade/**) -> diff неможливий: run_package=true (повний прогін пакета).
          # (5) odoo_supported = чи вміє скрипт C-00 {{ODOO_VERSION_PARAM}} цю версію. Зміна ci.yml -> run_package=true.
          # Зміна лише package/ НЕ додає клієнтів (тільки dispatch). Значення за замовчуванням ЗАВЖДИ виставляти першими:
          # run_package=false, run_config=false, clients=[] (порожнє значення зламає fromJSON), odoo_supported=false.
          # editions: IN_EDITION=ce -> ["ce"], ee -> ["ee"], порожньо|both -> ["ce","ee"] (К-06: ядро на CE, EE-підсилення td_*_ee; CE завжди в матриці пакета).
          # Тег клієнта: ЯКЩО є clients/REGISTRY.md - тег-кандидат пріоритетний, інакше поточний (див. ci-contract.md).
          python3 -I - <<'PY'
          {{RESOLVE_PY}}
          PY

  config-check:
    needs: resolve
    if: needs.resolve.outputs.run_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Конфіг без установки в базу
        run: |
          # {{CONFIG_CHECK}}: XML/CSV/YAML валідні; кожен модуль з «Модулі до установки» (CONFIG.md) є в package/addons АБО у списку
          # стандартних модулів, який дає скрипт/образ C-00. Джерела списку немає - перевіряти лише package/addons, решту в memo
          # (списку стандартних модулів не вигадувати).

  # core-deps: ядро пакета без залежностей від EE-модулів і AGPL (К-06, К-09); EE-підсилення - окремі td_*_ee (auto_install).
  core-deps:
    needs: resolve
    if: needs.resolve.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Залежності ядра (__manifest__ depends і license)
        run: |
          # скрипт зі складу плагіна flow-core: ci-pipeline-builder/scripts/check_core_deps.py; копію C-00 кладе в tools/odoo/ разом із шаблонами ({{CORE_DEPS_SCRIPT_PATH}} = tools/odoo/check_core_deps.py); FAIL -> exit 1
          # {{LICENSES_FILE}} (файл "модуль: ліцензія") і {{EE_MODULES_FILE}} (імена стандартних EE-модулів) веде C-00; файла немає -> прапор опускається, у memo: "залежності поза addons не оцінено"
          set -o pipefail
          python3 -I {{CORE_DEPS_SCRIPT_PATH}} --addons package/addons {{CORE_DEPS_OPTS}} | tee core-deps.json   # {{CORE_DEPS_OPTS}} = --licenses {{LICENSES_FILE}} --ee-modules {{EE_MODULES_FILE}} --odoo-addons {{ODOO_ADDONS_DIRS}} (лише наявні файли/каталоги; {{ODOO_ADDONS_DIRS}} = каталоги модулів Odoo, доступні CI, через кому)
          if grep -q '"CORE-external"' core-deps.json; then echo "core_deps_note=core-deps: залежності поза addons не оцінено (CORE-external)" >> "$GITHUB_OUTPUT"; fi
        id: cd
    outputs:
      core_deps_note: ${{ steps.cd.outputs.core_deps_note }}   # ci дописує до опису статусу

  package-tests:
    needs: resolve
    outputs:
      ce_verdict: ${{ steps.cev.outputs.ce_verdict }}   # пише лише CE-вузол матриці: PASS | FAIL; порожньо -> CE не запускалась (edition=ee)
      ee_verdict: ${{ steps.eev.outputs.ee_verdict }}   # пише лише EE-вузол: "WARN ee-unavailable" | ran:PASS | ran:FAIL; порожньо -> EE не запускалась (edition=ce)
    if: needs.resolve.outputs.run_package == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.resolve.outputs.editions) }}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Доступ до EE (лише edition=ee)
        id: ee
        if: matrix.edition == 'ee'
        env: {EE_SECRET: "${{ secrets.ODOO_EE_ACCESS }}"}   # спосіб доставки EE - рішення C-00 ({{EE_SETUP}}); секрету немає -> ee_available=false
        run: |
          # {{EE_SETUP}}: якщо EE доступна - виставити ODOO_EE_ADDONS_PATH і записати ee_available=true у $GITHUB_OUTPUT; інакше ee_available=false.
          # Доступ до EE не вигадувати: нема способу доставки - завжди false.
          echo "ee_available=false" >> "$GITHUB_OUTPUT"
      - name: Тести пакета на чистій базі
        id: tests
        env: {ODOO_VERSION: "${{ needs.resolve.outputs.odoo_version }}", ODOO_EDITION: "${{ matrix.edition }}", EE_AVAILABLE: "${{ steps.ee.outputs.ee_available }}"}
        run: |
          set -o pipefail
          if [ "$ODOO_EDITION" = "ee" ] && [ "$EE_AVAILABLE" != "true" ]; then
            # EE недоступна: НЕ PASS і не FAIL пакета - WARN ee-unavailable («не перевірено»); рядок читає Вердикт і агрегація ci
            echo "WARN ee-unavailable" | tee run-tests.log
          else
            # {{RUN_TESTS_CMD}} - лише з tools/odoo/ (C-00); ODOO_EDITION передається змінною; addons-path = package/addons (увесь каталог)
            rc=0
            {{RUN_TESTS_CMD}} 2>&1 | tee run-tests.log || rc=$?
            if [ "$ODOO_EDITION" = "ee" ] && [ "$rc" = "3" ]; then
              # код 3 скрипта C-00 = EE недоступна (ee-unavailable), а не збій тестів: WARN, не червоний job
              echo "WARN ee-unavailable" | tee -a run-tests.log; rc=0
            fi
            [ "$rc" = "0" ] || exit "$rc"
          fi
      - name: Вердикт
        id: verdict
        if: always()
        run: |
          # ee-unavailable: job завершується успішно, але вердикт редакції = WARN (не PASS)
          {{VERDICT_STEP}}   # references/test-verdict-rules.md; exit != 0 при червоному (skipped > 0, 0 тестів)
      - name: Вердикт CE для ci
        id: cev
        if: always() && matrix.edition == 'ce'
        env: {T: "${{ steps.tests.outcome }}", V: "${{ steps.verdict.outcome }}"}
        run: |
          if [ "$T" = "success" ] && [ "$V" = "success" ]; then echo "ce_verdict=PASS" >> "$GITHUB_OUTPUT"; else echo "ce_verdict=FAIL" >> "$GITHUB_OUTPUT"; fi
      - name: Вердикт EE для ci
        id: eev
        if: always() && matrix.edition == 'ee'
        env: {T: "${{ steps.tests.outcome }}", V: "${{ steps.verdict.outcome }}"}
        run: |
          if grep -q "WARN ee-unavailable" run-tests.log; then echo "ee_verdict=WARN ee-unavailable" >> "$GITHUB_OUTPUT"
          elif [ "$T" = "success" ] && [ "$V" = "success" ]; then echo "ee_verdict=ran:PASS" >> "$GITHUB_OUTPUT"
          else echo "ee_verdict=ran:FAIL" >> "$GITHUB_OUTPUT"; fi
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: "package-tests-log-${{ matrix.edition }}", path: run-tests.log}

  client-tests:
    needs: resolve
    if: needs.resolve.outputs.clients != '[]' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.resolve.outputs.clients) }}   # client-tests лише на CE (В-11)
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}", path: repo}
      - uses: {{PIN actions/checkout}}      # пакет на ТЕЗІ клієнта, не HEAD
        with: {ref: "${{ matrix.client.tag }}", path: package-at-tag}
      - name: Тести клієнта
        env: {ODOO_VERSION: "${{ needs.resolve.outputs.odoo_version }}", ODOO_EDITION: "ce", CLIENT: "${{ matrix.client.id }}"}   # client-tests: лише CE (В-11: тест клієнта на EE не реалізовано)
        run: |
          set -o pipefail
          # addons-path = package-at-tag/package/addons + repo/clients/$CLIENT/addons; команда - C-00
          {{RUN_TESTS_CMD_CLIENT}} 2>&1 | tee run-tests.log
      - name: Вердикт
        if: always()
        run: |
          {{VERDICT_STEP}}
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: "client-tests-log-${{ matrix.client.id }}", path: run-tests.log}

  tours:
    needs: resolve
    if: needs.resolve.outputs.run_package == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Тури зі scenarios.md (A-16)
        env: {ODOO_EDITION: ce}   # тури лише на CE (В-11)
        run: |
          set -o pipefail
          # {{TOURS_LIST}} - кожен тур окремо; результат кожного в tours.log з SHA; тур без результату = червоний
      - name: Вердикт
        if: always()
        run: |
          {{VERDICT_STEP}}   # tours.log: тур без результату -> exit 1
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: tours-log, path: tours.log}

  # config-matrix: генерувати ЛИШЕ коли є package/demo/profiles/ і команда установки конфігу; інакше видалити job
  # І його ім'я з ci.needs, записати у звіті config-matrix: N/A (причина). check_ci.py ловить needs на неіснуючий job.
  config-matrix:
    needs: resolve
    if: needs.resolve.outputs.run_config == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: {{PROFILES_JSON}}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - run: |
          # {{INSTALL_CONFIG_CMD}} --answers package/demo/profiles/${{ matrix.profile }}

  ci:
    needs: [resolve, core-deps, config-check, package-tests, client-tests, tours, config-matrix]
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: read, statuses: write}
    steps:
      - name: Агрегація
        id: agg
        env:
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SUPPORTED: ${{ needs.resolve.outputs.odoo_supported }}
          ODOO: ${{ needs.resolve.outputs.odoo_version }}
          RUN_PACKAGE: ${{ needs.resolve.outputs.run_package }}
          CE_VERDICT: ${{ needs.package-tests.outputs.ce_verdict }}
          EE_VERDICT: ${{ needs.package-tests.outputs.ee_verdict }}
          CORE_DEPS_NOTE: ${{ needs.core-deps.outputs.core_deps_note }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # failure/cancelled у будь-якому needs.*.result -> red; skipped допустимий лише там, де resolve не вимагав job
          # SUPPORTED != true -> red: "Odoo $ODOO: вибір образу не визначено, статус C-03 недійсний"
          # run_package/run_config=false і clients=[] -> green з текстом "нічого запускати"
          # package-tests (matrix edition): ce - обов'язковий PASS; ee з "WARN ee-unavailable" -> статус НЕ red, опис "EE WARN ee-unavailable (не перевірено)" - ніколи "EE PASS";
          #   ee з реальним червоним -> red. core-deps FAIL -> red. Опис редакцій - лише з фактів (ce_verdict/ee_verdict), не з жорсткого тексту.
          PT_DESC=""
          if [ "$RUN_PACKAGE" = "true" ]; then
            if [ -n "$CE_VERDICT" ]; then CE_DESC="CE $CE_VERDICT"; else CE_DESC="CE не запускалась (edition=ee)"; fi
            case "$EE_VERDICT" in
              "WARN ee-unavailable") EE_DESC="EE WARN ee-unavailable (не перевірено)" ;;
              ran:PASS) EE_DESC="EE PASS" ;;
              ran:FAIL) EE_DESC="EE FAIL" ;;
              *) EE_DESC="EE не запускалась (edition=ce)" ;;
            esac
            PT_DESC="$CE_DESC; $EE_DESC"
          fi
          # виконувані рядки опису (не лише коментарі): client-tests/tours завжди лише на CE; CORE-external -> застереження
          CE_ONLY_DESC="client-tests/tours: лише CE"
          if [ -n "$CORE_DEPS_NOTE" ]; then CORE_DESC="$CORE_DEPS_NOTE"; fi
          # опис статусу = "$PT_DESC; $CE_ONLY_DESC; $CORE_DESC" (порожні частини пропускати)
          {{AGGREGATE}}      # exit 1 при red
      - name: Commit status на input-SHA
        # лише dispatch з input sha (push/PR мають власний check-run); у PR з форків токен read-only - крок не виконується
        if: always() && inputs.sha != ''
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", SHA: "${{ inputs.sha }}", NEEDS: "${{ toJSON(needs) }}"}
        run: |
          # context=ci, state за вердиктом кроку Агрегація (steps.agg.outcome); curl -> /repos/$REPO/statuses/$SHA; {{COMMIT_STATUS}}

  report-odoo:
    needs: [resolve, ci]
    # лише push (main, upgrade/**) і dispatch, НЕ pull_request: секрети запису в базу флоу недоступні коду з PR (ci-security.md)
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: flow-report   # захищений Environment з обмеженням гілок; секрети - на ньому (задає Тімлід)
    steps:
      - name: Звіт у задачу Odoo (лише база флоу)
        env:
          ODOO_FLOW_URL: ${{ secrets.ODOO_FLOW_URL }}
          ODOO_FLOW_DB: ${{ secrets.ODOO_FLOW_DB }}
          ODOO_FLOW_API_KEY: ${{ secrets.ODOO_FLOW_API_KEY }}
          TASK: ${{ inputs.odoo_task }}
        run: |
          # id задачі: лише TASK (dispatch з odoo_task); на push поля з id задачі немає -> ::notice::, без падіння: на push звіт у задачу
          # Odoo пише flow-step-runner/flow-state-keeper, не CI. Немає секретів/id -> ::notice::, без падіння.
          # Пост: SHA, URL прогону, вердикти job'ів, лічильники; без логів. {{REPORT_ODOO}}
