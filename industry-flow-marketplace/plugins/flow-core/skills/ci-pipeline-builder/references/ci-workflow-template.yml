# Скелет .github/workflows/ci.yml для C-03. Плейсхолдери {{...}} агент замінює фактами (кроки 2-3 SKILL.md).
# Нерозв'язаний {{...}} у результаті = FAIL check_ci.py. Нічого не вигадувати: чого не знаєш - memo + ескалація.
# Фільтрів paths у on: НЕМАЄ навмисно: required check `ci` не має зависати на PR поза зонами пакета/клієнтів;
# обсяг прогону визначає job resolve (git diff); змін у зонах немає - ci зелений з текстом "нічого запускати".
name: ci
run-name: "ci ${{ inputs.sha || github.sha }} client=${{ inputs.client || '-' }} tag=${{ inputs.package_tag || '-' }}"

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_tag: {description: "Тег пакета; порожньо - тег клієнта з REGISTRY.md", required: false, default: ""}
      client:      {description: "Ідентифікатор клієнта (DATA_POLICY)", required: false, default: ""}
      odoo_version: {description: "Версія Odoo; порожньо - із суфікса тега/гілки, інакше 19", required: false, default: ""}
      sha:         {description: "SHA для перевірки; порожньо - HEAD гілки", required: false, default: ""}
      odoo_task:   {description: "id задачі Odoo для звіту (необов'язково)", required: false, default: ""}

concurrency:
  # push і dispatch групуються за SHA й не скасовуються (A-14 не має прочитати cancelled як червоне); скасування лише старіших PR-прогонів
  group: ci-${{ github.event_name == 'pull_request' && github.ref || inputs.sha || github.sha }}-${{ inputs.client || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      run_package: ${{ steps.r.outputs.run_package }}
      run_config: ${{ steps.r.outputs.run_config }}
      clients: ${{ steps.r.outputs.clients }}        # JSON: [{"id":"k01","tag":"v1.1"}]
      odoo_version: ${{ steps.r.outputs.odoo_version }}
      odoo_supported: ${{ steps.r.outputs.odoo_supported }}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ inputs.sha || github.sha }}", fetch-depth: 0}
      - id: r
        env:   # event-поля лише через env, не в тексті run:
          IN_TAG: ${{ inputs.package_tag }}
          IN_CLIENT: ${{ inputs.client }}
          IN_ODOO: ${{ inputs.odoo_version }}
          IN_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # {{RESOLVE}}: (1) sha = IN_SHA або HEAD; (2) diff проти BASE_REF/BEFORE -> run_package/run_config/clients;
          # (3) клієнти: dispatch -> IN_CLIENT; тег = IN_TAG, інакше з clients/REGISTRY.md (тег-кандидат пріоритетний)
          #     {{REGISTRY_PARSE}} - за фактичним форматом файла; (4) odoo_version за references/odoo-version-resolve.md;
          # BEFORE з одних нулів (перший push нової гілки upgrade/**) -> diff неможливий: run_package=true (повний прогін пакета).
          # (5) odoo_supported = чи вміє скрипт C-00 {{ODOO_VERSION_PARAM}} цю версію. Зміна ci.yml -> run_package=true.
          # Зміна лише package/ НЕ додає клієнтів (тільки dispatch). Значення за замовчуванням ЗАВЖДИ виставляти першими:
          # run_package=false, run_config=false, clients=[] (порожнє значення зламає fromJSON), odoo_supported=false.
          # Тег клієнта: ЯКЩО є clients/REGISTRY.md - тег-кандидат пріоритетний, інакше поточний (див. ci-contract.md).
          python3 -I - <<'PY'
          {{RESOLVE_PY}}
          PY

  config-check:
    needs: resolve
    if: needs.resolve.outputs.run_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Конфіг без установки в базу
        run: |
          # {{CONFIG_CHECK}}: XML/CSV/YAML валідні; кожен модуль з «Модулі до установки» (CONFIG.md) є в package/addons АБО у списку
          # стандартних модулів, який дає скрипт/образ C-00. Джерела списку немає - перевіряти лише package/addons, решту в memo
          # (списку стандартних модулів не вигадувати).

  package-tests:
    needs: resolve
    if: needs.resolve.outputs.run_package == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Тести пакета на чистій базі
        env: {ODOO_VERSION: "${{ needs.resolve.outputs.odoo_version }}"}
        run: |
          set -o pipefail
          # {{RUN_TESTS_CMD}} - лише з tools/odoo/ (C-00); addons-path = package/addons (увесь каталог)
          {{RUN_TESTS_CMD}} 2>&1 | tee run-tests.log
      - name: Вердикт
        if: always()
        run: |
          {{VERDICT_STEP}}   # references/test-verdict-rules.md; exit != 0 при червоному
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: package-tests-log, path: run-tests.log}

  client-tests:
    needs: resolve
    if: needs.resolve.outputs.clients != '[]' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.resolve.outputs.clients) }}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}", path: repo}
      - uses: {{PIN actions/checkout}}      # пакет на ТЕЗІ клієнта, не HEAD
        with: {ref: "${{ matrix.client.tag }}", path: package-at-tag}
      - name: Тести клієнта
        env: {ODOO_VERSION: "${{ needs.resolve.outputs.odoo_version }}", CLIENT: "${{ matrix.client.id }}"}
        run: |
          set -o pipefail
          # addons-path = package-at-tag/package/addons + repo/clients/$CLIENT/addons; команда - C-00
          {{RUN_TESTS_CMD_CLIENT}} 2>&1 | tee run-tests.log
      - name: Вердикт
        if: always()
        run: |
          {{VERDICT_STEP}}
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: "client-tests-log-${{ matrix.client.id }}", path: run-tests.log}

  tours:
    needs: resolve
    if: needs.resolve.outputs.run_package == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: {{TIMEOUT}}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - name: Тури зі scenarios.md (A-16)
        run: |
          set -o pipefail
          # {{TOURS_LIST}} - кожен тур окремо; результат кожного в tours.log з SHA; тур без результату = червоний
      - name: Вердикт
        if: always()
        run: |
          {{VERDICT_STEP}}   # tours.log: тур без результату -> exit 1
      - uses: {{PIN actions/upload-artifact}}
        if: always()
        with: {name: tours-log, path: tours.log}

  # config-matrix: генерувати ЛИШЕ коли є package/demo/profiles/ і команда установки конфігу; інакше видалити job
  # І його ім'я з ci.needs, записати у звіті config-matrix: N/A (причина). check_ci.py ловить needs на неіснуючий job.
  config-matrix:
    needs: resolve
    if: needs.resolve.outputs.run_config == 'true' && needs.resolve.outputs.odoo_supported == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: {{PROFILES_JSON}}
    steps:
      - uses: {{PIN actions/checkout}}
        with: {ref: "${{ needs.resolve.outputs.sha }}"}
      - run: |
          # {{INSTALL_CONFIG_CMD}} --answers package/demo/profiles/${{ matrix.profile }}

  ci:
    needs: [resolve, config-check, package-tests, client-tests, tours, config-matrix]
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: read, statuses: write}
    steps:
      - name: Агрегація
        id: agg
        env:
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SUPPORTED: ${{ needs.resolve.outputs.odoo_supported }}
          ODOO: ${{ needs.resolve.outputs.odoo_version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # failure/cancelled у будь-якому needs.*.result -> red; skipped допустимий лише там, де resolve не вимагав job
          # SUPPORTED != true -> red: "Odoo $ODOO: вибір образу не визначено, статус C-03 недійсний"
          # run_package/run_config=false і clients=[] -> green з текстом "нічого запускати"
          {{AGGREGATE}}      # exit 1 при red
      - name: Commit status на input-SHA
        # лише dispatch з input sha (push/PR мають власний check-run); у PR з форків токен read-only - крок не виконується
        if: always() && inputs.sha != ''
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", SHA: "${{ inputs.sha }}", NEEDS: "${{ toJSON(needs) }}"}
        run: |
          # context=ci, state за вердиктом кроку Агрегація (steps.agg.outcome); curl -> /repos/$REPO/statuses/$SHA; {{COMMIT_STATUS}}

  report-odoo:
    needs: [resolve, ci]
    # лише push (main, upgrade/**) і dispatch, НЕ pull_request: секрети запису в базу флоу недоступні коду з PR (ci-security.md)
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: flow-report   # захищений Environment з обмеженням гілок; секрети - на ньому (задає Тімлід)
    steps:
      - name: Звіт у задачу Odoo (лише база флоу)
        env:
          ODOO_FLOW_URL: ${{ secrets.ODOO_FLOW_URL }}
          ODOO_FLOW_DB: ${{ secrets.ODOO_FLOW_DB }}
          ODOO_FLOW_API_KEY: ${{ secrets.ODOO_FLOW_API_KEY }}
          TASK: ${{ inputs.odoo_task }}
        run: |
          # id задачі: лише TASK (dispatch з odoo_task); на push поля з id задачі немає -> ::notice::, без падіння: на push звіт у задачу
          # Odoo пише flow-step-runner/flow-state-keeper, не CI. Немає секретів/id -> ::notice::, без падіння.
          # Пост: SHA, URL прогону, вердикти job'ів, лічильники; без логів. {{REPORT_ODOO}}
