<!-- Заставка наприкінці (16:9 і 9:16): логотип ToDo, заклик, адреса. Поля: headline, cta, tagline, note. -->
<div class="stage">{{logo}}
  <div class="in" style="--d:.5s;font-size:{{fs_head}}px;font-weight:700;line-height:1.15">{{headline}}</div>
  <div class="cta in" style="--d:1.2s;margin-top:44px;font-size:{{fs_cta}}px">{{cta}}</div>
  <div class="in" style="--d:1.9s;font-size:{{fs_tag}}px;margin-top:34px">{{tagline}}</div>
  <div class="in" style="--d:2.6s;font-size:24px;color:#808080;margin-top:34px;max-width:1400px">{{note}}</div></div>
