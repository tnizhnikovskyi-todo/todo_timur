<!-- Гачок Reels (9:16, 0–3 с): проблема або обіцянка, а не логотип. Поля: kicker, headline (виділення **…**), sub. -->
<div class="stage">
  <div style="font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:#FE5000;font-weight:700;margin-bottom:26px">{{kicker}}</div>
  <div style="font-size:78px;font-weight:700;line-height:1.16">{{headline}}</div>
  <div style="font-size:36px;color:#BFBFBF;margin-top:34px">{{sub}}</div></div>
