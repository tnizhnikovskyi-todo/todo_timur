  mvp_hours: {low: null, high: null}
  bridges_hours: {low: null, high: null}   # від вердиктів edition-claims.md
pricing:
  currency: "UAH"
  fx: {rate: null, date: "{{YYYY-MM-DD}}", source: "{{НБУ}}"}
  ce_entry: null
  ee_upgrade: null
  competitors: []                      # [{id, price, unit, conditions, source_id: SRC-NNN}]
payback:
  n_customers_sensitivity: [1, 3, 5, 10]
  breakeven_months: null
sources: []                            # ID `SRC-NNN` рядків research/sources-log.md
