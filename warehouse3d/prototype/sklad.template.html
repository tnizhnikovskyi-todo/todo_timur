<title>Склад меблевої фабрики</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Оболонка за зразком веб-клієнта Odoo 17–19: панель застосунку, контрольна панель з хлібними крихтами,
   пошуком і перемикачем видів; під нею — вид (план, список, канбан) або картка запису на сірому тлі. */
:root {
  --o-brand: #714b67;
  --o-brand-hover: #5f3f57;
  --o-link: #017e84;
  --o-text: #374151;
  --o-muted: #6b7280;
  --o-border: #d8dadd;
  --o-hover: #f3f4f6;
  --o-bg: #ffffff;
  --o-form-bg: #f3f4f6;
  --o-nav: #ffffff;
  --o-btn2: #e7e9ed;
  --o-btn2-hover: #d8dadd;
  /* токени плану (2D/3D) */
  --panel: #ffffff; --fg: #374151; --muted: #6b7280; --line: #d8dadd; --accent: #714b67; --accent-soft: rgba(113, 75, 103, 0.12);
  --ok: #28a745; --warn: #e99d00; --bad: #d44c59; --idle: #8f969e; --info: #017e84; --mark: #f0c419; --cell-empty: #e5e7eb;
  --floor: #f7f8f9; --scene: #e9ecef; --area: rgba(143, 150, 158, 0.18); --hatch: rgba(107, 114, 128, 0.22);
  --steel: #6f7d8a; --beam: #e0761c; --upright: #2f6fae; --wood: #b08a5a;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --f-display: var(--f-body);
  --f-mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --o-brand: #a87ca0; --o-brand-hover: #b98fb1; --o-link: #34b8bd; --o-text: #d6d8dd; --o-muted: #9a9fae; --o-border: #3c4050;
    --o-hover: #313543; --o-bg: #262a36; --o-form-bg: #1f222b; --o-nav: #1b1d26; --o-btn2: #3a3e4c; --o-btn2-hover: #464b5b;
    --panel: #2b2f3c; --fg: #d6d8dd; --muted: #9a9fae; --line: #3c4050; --accent: #c49abc; --accent-soft: rgba(196, 154, 188, 0.18);
    --ok: #3cc479; --warn: #f0a52a; --bad: #f0606f; --idle: #8d9aa6; --info: #34b8bd; --mark: #f2c230; --cell-empty: #343948;
    --floor: #1f232d; --scene: #1a1d26; --area: rgba(141, 154, 166, 0.16); --hatch: rgba(147, 161, 174, 0.18);
    --steel: #7d8b98; --beam: #e88a35; --upright: #4a8ad0; --wood: #9c7a50; --shadow: 0 4px 14px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --o-brand: #a87ca0; --o-brand-hover: #b98fb1; --o-link: #34b8bd; --o-text: #d6d8dd; --o-muted: #9a9fae; --o-border: #3c4050;
  --o-hover: #313543; --o-bg: #262a36; --o-form-bg: #1f222b; --o-nav: #1b1d26; --o-btn2: #3a3e4c; --o-btn2-hover: #464b5b;
  --panel: #2b2f3c; --fg: #d6d8dd; --muted: #9a9fae; --line: #3c4050; --accent: #c49abc; --accent-soft: rgba(196, 154, 188, 0.18);
  --ok: #3cc479; --warn: #f0a52a; --bad: #f0606f; --idle: #8d9aa6; --info: #34b8bd; --mark: #f2c230; --cell-empty: #343948;
  --floor: #1f232d; --scene: #1a1d26; --area: rgba(141, 154, 166, 0.16); --hatch: rgba(147, 161, 174, 0.18);
  --steel: #7d8b98; --beam: #e88a35; --upright: #4a8ad0; --wood: #9c7a50; --shadow: 0 4px 14px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--o-bg); color: var(--o-text); font: 14px/1.5 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--o-link); }
:focus-visible { outline: 2px solid var(--o-brand); outline-offset: 1px; }
.o_web_client { height: 100%; display: flex; flex-direction: column; }

/* панель застосунку */
.o_navbar { flex: none; display: flex; align-items: center; gap: 4px; height: 46px; background: var(--o-nav); border-bottom: 1px solid var(--o-border);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.o_navbar .apps { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: var(--o-text); }
.o_navbar .apps:hover, .o_menu:hover { background: var(--o-hover); }
.o_brandname { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 400; margin: 0 8px 0 4px; white-space: nowrap; }
.o_menus { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.o_menu { border: 0; background: transparent; padding: 0 12px; height: 46px; cursor: pointer; white-space: nowrap; color: var(--o-text); }
.o_menu { height: 30px; padding: 0 10px; border-radius: 4px; border: 1px solid transparent; }
.o_menu[aria-current="page"], .o_menu[aria-expanded="true"] { border-color: color-mix(in srgb, var(--o-link) 55%, transparent); background: color-mix(in srgb, var(--o-link) 8%, transparent); }
.o_menus { align-items: center; gap: 4px; }
.o_menu_dd { position: fixed; z-index: 30; min-width: 200px; max-width: calc(100vw - 16px); max-height: calc(100vh - 70px); overflow: auto; background: var(--o-bg);
  border: 1px solid var(--o-border); border-radius: 4px; box-shadow: var(--shadow); padding: 6px 0; display: flex; flex-direction: column; }
.o_menu_dd .h { padding: 8px 20px 2px; font-size: 13px; font-weight: 500; color: var(--o-muted); }
.o_menu_dd .it { display: block; text-align: left; border: 0; background: transparent; padding: 5px 20px; font-size: 14px; color: var(--o-text); white-space: nowrap; cursor: pointer; }
.o_menu_dd .it.ind { padding-left: 32px; }
.o_menu_dd button.it:hover, .o_menu_dd button.it:focus-visible { background: var(--o-hover); outline: none; }
.o_menu_dd .it.off { color: color-mix(in srgb, var(--o-muted) 70%, transparent); cursor: default; }
.o_systray { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--o-muted); white-space: nowrap; }
.o_db { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--o-border); border-radius: 4px; font-family: var(--f-mono); font-size: 11px; }
.o_db i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.o_avatar { width: 28px; height: 28px; border-radius: 4px; background: var(--o-brand); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
@media (max-width: 900px) { .o_systray .o_db, .o_systray .o_company { display: none; } }

/* контрольна панель */
.o_control_panel { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 2fr) minmax(0, 1fr); gap: 8px 16px; align-items: center;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--o-border); background: var(--o-bg); }
.o_control_panel.nosearch { grid-template-columns: minmax(0, 1fr) auto; }
.o_control_panel.nosearch .o_searchwrap { display: none; }
.o_bc { display: flex; align-items: center; gap: 6px; font-size: 17px; min-width: 0; flex-wrap: wrap; }
.o_bc a { color: var(--o-link); text-decoration: none; cursor: pointer; white-space: nowrap; }
.o_bc a:hover { text-decoration: underline; }
.o_bc .sep { color: var(--o-muted); }
.o_bc .cur { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o_cp_right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.o_pager { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--o-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.o_pager button { width: 28px; height: 28px; border: 0; background: var(--o-btn2); border-radius: 4px; cursor: pointer; }
.o_pager button:hover:not(:disabled) { background: var(--o-btn2-hover); }
.o_pager button:disabled { opacity: 0.4; cursor: default; }
.o_switch { display: inline-flex; border-radius: 4px; overflow: hidden; }
.o_switch button { width: 34px; height: 30px; border: 0; background: var(--o-btn2); cursor: pointer; display: grid; place-items: center; color: var(--o-text); }
.o_switch button + button { border-left: 1px solid var(--o-border); }
.o_switch button[aria-pressed="true"] { background: var(--o-brand); color: #fff; }
.o_switch button:hover:not([aria-pressed="true"]) { background: var(--o-btn2-hover); }
@media (max-width: 760px) {
  .o_control_panel { grid-template-columns: minmax(0, 1fr) auto; }
  .o_searchwrap { grid-column: 1 / -1; grid-row: 2; }
}

/* пошук */
.o_searchwrap { position: relative; min-width: 0; }
.o_searchview { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 34px; border: 1px solid var(--o-border); border-radius: 4px; padding: 2px 4px 2px 8px; background: var(--o-bg); }
.o_searchview:focus-within { border-color: var(--o-brand); }
.o_searchview svg { color: var(--o-muted); flex: none; }
.o_facet { display: inline-flex; align-items: stretch; border-radius: 3px; overflow: hidden; font-size: 12px; background: var(--o-btn2); max-width: 100%; }
.o_facet b { background: var(--o-brand); color: #fff; padding: 2px 6px; font-weight: 500; display: flex; align-items: center; }
.o_facet span { padding: 2px 6px; display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o_facet button { border: 0; background: transparent; cursor: pointer; padding: 0 6px; color: var(--o-muted); }
.o_facet button:hover { color: var(--o-text); }
.o_searchview input { flex: 1; min-width: 120px; border: 0; background: transparent; color: var(--o-text); font: inherit; padding: 4px; outline: none; }
.o_toggler { border: 0; background: transparent; width: 28px; height: 28px; cursor: pointer; color: var(--o-muted); border-radius: 3px; }
.o_toggler:hover { background: var(--o-hover); color: var(--o-text); }
.o_dropdown { position: absolute; z-index: 20; top: calc(100% + 4px); right: 0; left: 0; background: var(--o-bg); border: 1px solid var(--o-border); border-radius: 4px;
  box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); padding: 8px 0; max-height: 60vh; overflow: auto; }
.o_dropdown section { padding: 0 8px; min-width: 0; }
.o_dropdown section + section { border-left: 1px solid var(--o-border); }
.o_dropdown h4 { margin: 4px 8px 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.o_dropdown h4 svg { color: var(--o-brand); }
.o_dropdown button.it { display: flex; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 8px 4px 26px; cursor: pointer; border-radius: 3px; position: relative; font-size: 13px; }
.o_dropdown button.it:hover { background: var(--o-hover); }
.o_dropdown button.it[aria-checked="true"]::before { content: "✓"; position: absolute; left: 9px; color: var(--o-brand); font-weight: 700; }
.o_dropdown hr { border: 0; border-top: 1px solid var(--o-border); margin: 4px 8px; }

/* вміст */
.o_content { flex: 1; min-height: 0; overflow: auto; position: relative; }
.o_content.form { background: var(--o-form-bg); }
.o_help { display: grid; grid-template-columns: 200px minmax(0, 860px); gap: 24px; justify-content: center; padding: 20px 16px 40px; }
.o_help .toc { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.o_help .toc .h { font-weight: 600; color: var(--o-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; margin: 0 0 6px 8px; }
.o_help .toc a { color: var(--o-text); text-decoration: none; padding: 5px 8px; border-radius: 4px; border-left: 2px solid transparent; }
.o_help .toc a:hover { background: var(--o-hover); border-left-color: var(--o-brand); }
.hl-sheet { margin: 0; padding: 28px 36px; max-width: none; }
.hl-sheet h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
.hl-sheet h2 { font-size: 17px; font-weight: 600; margin: 0 0 8px; color: var(--o-brand); }
.hl-sheet section { padding: 18px 0 6px; border-top: 1px solid var(--o-border); margin-top: 14px; scroll-margin-top: 12px; }
.hl-sheet section:first-of-type { border-top: 0; margin-top: 0; }
.hl-sheet p, .hl-sheet li { max-width: 72ch; }
.hl-sheet ul { padding-left: 20px; margin: 6px 0; }
.hl-sheet li { margin: 5px 0; }
.hl-sheet kbd { font: 12px var(--f-mono); padding: 1px 6px; border: 1px solid var(--o-border); border-bottom-width: 2px; border-radius: 4px; background: var(--o-form-bg); white-space: nowrap; }
.hl-sheet .code { font-family: var(--f-mono); font-size: 12.5px; }
.hl-t { margin: 10px 0; width: 100%; }
.hl-t td { vertical-align: top; }
.hl-t td.first { white-space: nowrap; width: 1%; padding-right: 18px; }
.hl-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--o-muted); margin-top: 8px; }
.hl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hl-legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
@media (max-width: 900px) { .o_help { grid-template-columns: minmax(0, 1fr); padding: 12px 0 32px; } .o_help .toc { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 0 16px; }
  .o_help .toc .h { display: none; } .o_help .toc a { border: 1px solid var(--o-border); border-radius: 12px; padding: 3px 10px; background: var(--o-bg); }
  .hl-sheet { padding: 18px 16px; border-left: 0; border-right: 0; } .hl-t td.first { white-space: normal; } }
.pad { padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* список */
.o_list { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.o_list th { position: sticky; top: 0; z-index: 1; background: var(--o-bg); text-align: left; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--o-border); white-space: nowrap; cursor: pointer; user-select: none; }
.o_list th:hover { background: var(--o-hover); }
.o_list th.n, .o_list td.n { text-align: right; }
.o_list th .ar { color: var(--o-muted); margin-left: 4px; font-size: 10px; }
.o_list td { padding: 7px 10px; border-bottom: 1px solid var(--o-border); vertical-align: middle; }
.o_list tbody tr.rec { cursor: pointer; }
.o_list tbody tr.rec:hover td { background: var(--o-hover); }
.o_list tr.grp td { background: color-mix(in srgb, var(--o-btn2) 55%, transparent); font-weight: 600; cursor: pointer; }
.o_list tr.grp:hover td { background: var(--o-btn2); }
.o_list tr.grp .car { display: inline-block; width: 14px; color: var(--o-muted); }
.o_list td.first, .o_list th.first { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
.o_list .mut { color: var(--o-muted); }
.o_list .code { font-family: var(--f-mono); font-size: 12px; }
.listwrap { overflow-x: auto; }
.o_nocontent { text-align: center; padding: 60px 16px; color: var(--o-muted); }
.o_nocontent b { display: block; color: var(--o-text); font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: color-mix(in srgb, var(--warn) 80%, var(--o-text)); }
.badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.badge.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.badge.idle { background: var(--o-btn2); color: var(--o-muted); }
.o_pb { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.o_pb .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--cell-empty); overflow: hidden; }
.o_pb .bar i { display: block; height: 100%; background: var(--ok); }
.o_pb.warn .bar i { background: var(--warn); } .o_pb.bad .bar i { background: var(--bad); }
.o_pb span { font-size: 12px; min-width: 34px; text-align: right; }

/* канбан */
.o_kanban { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.o_kcard { display: flex; gap: 10px; background: var(--o-bg); border: 1px solid var(--o-border); border-radius: 4px; padding: 8px; cursor: pointer; text-align: left; width: 100%; min-width: 0; }
.o_kcard:hover { box-shadow: var(--shadow); }
.o_kimg { width: 64px; height: 64px; flex: none; border-radius: 3px; display: grid; place-items: center; color: #fff; font: 600 13px var(--f-mono); letter-spacing: 0.02em; }
.o_kcard .kb { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
.o_kcard .kt { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.o_kcard .mut { color: var(--o-muted); }
.o_kcols { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.o_kcol { flex: 0 0 300px; display: flex; flex-direction: column; gap: 8px; }
.o_kcol h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; padding: 2px 2px 4px; }
.o_kcol h3 span { color: var(--o-muted); font-weight: 400; }

/* дашборд «Огляд» */
.o_dash { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.o_dcard { background: var(--o-bg); border: 1px solid var(--o-border); border-radius: 2px; padding: 14px 16px; min-height: 150px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.o_dcard h3 { margin: 0; font-size: 18px; font-weight: 500; color: var(--o-link); }
.o_dcard h3 small { display: none; }
.o_dcard .row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.o_dcard .links { display: flex; flex-direction: column; gap: 2px; align-items: stretch; min-width: 170px; font-size: 14px; }
.o_dcard .links button { border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--o-link); display: flex; justify-content: space-between; gap: 14px; text-align: left; }
.o_dcard .links button b { font-weight: 400; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: left; }
.o_dcard .links button.bad { color: var(--bad); }
.o_dcard .links button:hover { text-decoration: underline; }
.o_dcard .links .mut { color: var(--o-muted); }
.btn { border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn-primary { background: var(--o-brand); color: #fff; }
.btn-primary:hover { background: var(--o-brand-hover); }
.btn-secondary { background: var(--o-btn2); color: var(--o-text); }
.btn-secondary:hover { background: var(--o-btn2-hover); }
.btn-link { background: transparent; color: var(--o-link); padding: 6px 4px; }

/* картка запису */
.o_form_wrap { padding-block: 16px 32px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.o_statusbar { max-width: 1140px; margin: 0 auto 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.o_status { display: flex; }
.o_status span { position: relative; padding: 5px 14px 5px 20px; font-size: 13px; background: var(--o-bg); border: 1px solid var(--o-border); margin-left: -1px; color: var(--o-muted);
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%); }
.o_status span:first-child { clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); padding-left: 12px; }
.o_status span.on { background: var(--o-brand); color: #fff; border-color: var(--o-brand); }
.o_sheet { max-width: 1140px; margin: 0 auto; background: var(--o-bg); border: 1px solid var(--o-border); border-radius: 2px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  padding: 20px 32px 28px; min-width: 0; }
@media (max-width: 760px) { .o_sheet { padding: 16px; } }
.o_btnbox { display: flex; justify-content: flex-end; flex-wrap: wrap; margin: -20px -32px 16px; border-bottom: 1px solid var(--o-border); }
@media (max-width: 760px) { .o_btnbox { margin: -16px -16px 12px; justify-content: flex-start; } }

function facets(e) {

  const v = ev.target.closest("[data-view]"); if (v) { cur().view = v.dataset.view; render(); return; }
  const pg = ev.target.closest("[data-pg]"); if (pg) { const e = cur(); const i = (e.ids.indexOf(e.id) + +pg.dataset.pg + e.ids.length) % e.ids.length; go({ ...e, id: e.ids[i], tab: 0 }, true); }
});
$("#content").addEventListener("click", (ev) => {
  const o = ev.target.closest("[data-open]"); if (o) { const [m, ...id] = o.dataset.open.split(":"); openForm(m, id.join(":"), o.dataset.ids ? JSON.parse(o.dataset.ids) : undefined); return; }
  const a = ev.target.closest("[data-act]"); if (a) { navAct(JSON.parse(a.dataset.act)); return; }
});
// перехід до дії з наперед заданим фільтром: {key, view, filters:[…], custom:{label,value,kind,arg}, sel}
function navAct(o) {
  const e = actEntry(o.key, o.view);
  (o.filters || []).forEach((f) => e.s.filters.add(f));
  if (o.custom) e.s.custom.push(customFacet(o.custom));
  if (o.sel) { planState.sel = o.sel; planState.focus = focusForCode(o.sel); planState.esel = TREE.byCode.get(o.sel)?.id || null; }
  if (o.reset) { const id = Object.keys(MENU_ITEMS).find((k) => MENU_ITEMS[k].key === o.key && (!o.view || MENU_ITEMS[k].view === o.view));
    if (id) { e.top = MENU_ITEMS[id].top; e.title = MENU_ITEMS[id].title; } stack = [e]; render(); } else go(e);
}
function customFacet(c) {
  if (c.kind === "product") return { label: "Продукт", value: P(c.arg).name, fn: (r) => (r.q ? r.q.product === c.arg : r.l?.quants.some((q) => q.product === c.arg)) };
  if (c.kind === "loc") return { label: "Місце", value: c.arg, fn: (r) => r.code === c.arg };
  if (c.kind === "po") { const po = D.purchase_orders.find((p) => p.name === c.arg);
    return { label: "Закупівля", value: c.arg, fn: (r) => r.po ? r.po.name === c.arg : r.p ? po.lines.some((l) => l.product === r.p.default_code) : po.locations.includes(r.code) }; }
  if (c.kind === "pos") return { label: "Закупівля", value: "у дорозі", fn: (r) => r.po ? r.po.lines.some((l) => l.product === c.arg) : true };
}

const MODEL = { products: "product", quants: "location", locations: "location", purchases: "po" };
const recOpenId = (key, r) => key === "quants" ? r.code : r.id;
function sortRecs(e, rs) {
  if (!e.sort) return rs;
  const c = COLS[e.key].find((x) => x.k === e.sort.k); if (!c?.s) return rs;
  return [...rs].sort((a, b) => { const x = c.s(a), y = c.s(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "uk")) * (e.sort.asc ? 1 : -1); });
}
function renderList(e) {
  const cols = COLS[e.key], rs = sortRecs(e, records(e)), c = $("#content");
  if (!rs.length) { c.innerHTML = noContent(); return; }
  const ids = e.key === "quants" ? undefined : JSON.stringify(rs.map((r) => r.id));
  const row = (r) => `<tr class="rec" data-open="${MODEL[e.key]}:${esc(recOpenId(e.key, r))}">${cols.map((col, i) => `<td class="${col.n ? "n" : ""}${i === 0 ? " first" : ""}">${col.v(r)}</td>`).join("")}</tr>`;
  let body = "";
  if (e.s.groupby) {
    const g = ACTIONS[e.key].groupby.find((x) => x.key === e.s.groupby), groups = new Map();
    for (const r of rs) { const k = g.fn(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    for (const [k, grs] of groups) {
      const open = e.open.has(k);
      body += `<tr class="grp" data-grp="${esc(k)}" aria-expanded="${open}"><td class="first" colspan="${cols.findIndex((x) => x.sum) > 0 ? cols.findIndex((x) => x.sum) : cols.length}"><span class="car">${open ? "▾" : "▸"}</span>${esc(k)} (${grs.length})</td>
        ${cols.findIndex((x) => x.sum) > 0 ? cols.slice(cols.findIndex((x) => x.sum)).map((col) => `<td class="${col.n ? "n" : ""}">${col.sum && g.sum ? col.sum(grs) : ""}</td>`).join("") : ""}</tr>`;
      if (open) body += grs.map(row).join("");
    }
  } else body = rs.map(row).join("");
  c.innerHTML = `<div class="listwrap"><table class="o_list"><thead><tr>${cols.map((col, i) => `<th class="${col.n ? "n" : ""}${i === 0 ? " first" : ""}" data-sort="${col.k}">${esc(col.t)}${e.sort?.k === col.k ? `<span class="ar">${e.sort.asc ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
  if (ids) c.querySelectorAll("tr.rec").forEach((tr) => tr.dataset.ids = ids);
  c.querySelectorAll("[data-sort]").forEach((th) => th.onclick = () => { const k = th.dataset.sort; e.sort = e.sort?.k === k ? (e.sort.asc ? { k, asc: false } : null) : { k, asc: true }; renderList(e); });
  c.querySelectorAll("[data-grp]").forEach((tr) => tr.onclick = () => { const k = tr.dataset.grp; e.open.has(k) ? e.open.delete(k) : e.open.add(k); renderList(e); });
}

function renderKanban(e) {

// SAVED — збережені правки (спільні); PENDING — незбережені зміни по об'єктах; EDIT — що показуємо = SAVED + PENDING
const emptyEdit = () => ({ v: 1, types: null, add: [], del: [], set: [], pos: [], rot: [] });
const clone = (x) => JSON.parse(JSON.stringify(x));
let SAVED = emptyEdit(), PENDING = [], EDIT = emptyEdit();

$("#menus").innerHTML = MENU.map((m, i) => `<button class="o_menu" data-top="${i}"${m.sections ? ' aria-haspopup="true" aria-expanded="false"' : ""}>${esc(m.label)}</button>`).join("");
let menuDd = null;
function closeMenu() { menuDd?.remove(); menuDd = null; document.querySelectorAll(".o_menu[aria-expanded]").forEach((b) => b.setAttribute("aria-expanded", "false")); }
function openMenu(btn) {
  const m = MENU[+btn.dataset.top];
  closeMenu();
  menuDd = document.createElement("div"); menuDd.className = "o_menu_dd"; menuDd.setAttribute("role", "menu");
  menuDd.innerHTML = m.sections.map(([h, items]) => `${h ? `<div class="h">${esc(h)}</div>` : ""}${items.map(([label, id]) => id
    ? `<button role="menuitem" class="it${h ? " ind" : ""}" data-menu="${id}">${esc(label)}</button>`
    : `<span role="menuitem" class="it off${h ? " ind" : ""}" aria-disabled="true" title="Розділ ще не підключено">${esc(label)}</span>`).join("")}`).join("");
  document.body.append(menuDd);
  const r = btn.getBoundingClientRect();
  menuDd.style.top = `${r.bottom + 4}px`;
  menuDd.style.left = `${Math.max(8, Math.min(r.left, innerWidth - menuDd.offsetWidth - 8))}px`;
  btn.setAttribute("aria-expanded", "true");
  menuDd.onclick = (ev) => { const it = ev.target.closest("[data-menu]"); if (it) menu(it.dataset.menu); };
  menuDd.querySelector("[data-menu]")?.focus();
}
$("#menus").onclick = (ev) => { const b = ev.target.closest(".o_menu"); if (!b) return; ev.stopPropagation();
  const m = MENU[+b.dataset.top]; if (m.go) return menu(m.id);
  b.getAttribute("aria-expanded") === "true" ? closeMenu() : openMenu(b); };
document.addEventListener("click", (ev) => { if (menuDd && !ev.target.closest(".o_menu_dd")) closeMenu(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && menuDd) closeMenu(); });
addEventListener("resize", closeMenu);
$("#menus").addEventListener("scroll", closeMenu);
$("#apps").onclick = () => menu("overview");
$("#dbname").textContent = `${D.meta.source.split("·").pop().trim()} · ${D.meta.now.slice(8, 10)}.${D.meta.now.slice(5, 7)} ${D.meta.now.slice(11, 16)}`;
$("#company").textContent = D.meta.company;
render();
Store.init();
</script>
